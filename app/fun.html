<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>놀이터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
/* 놀이터 · 재미로 머무는 곳 (운세·성향 테스트·퀴즈·기억력 게임·아침 인사 카드·밸런스 게임)
   원칙: 종목 추천·매매 권유·시세는 어디에도 넣지 않아요. 50~80대가 쓰기 쉽게 글자·단추를 크게. */
:root{--bg:#120F0B;--surface:#1A1611;--raise:#221D16;--line:#342C22;--ink:#F3EEE6;--ink2:#A99C8B;--accent:#FFB547;--on-accent:#221400;--soft:rgba(255,181,71,.12);--good:#6FCF97;--bad:#FF8A80;
  --f:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color-scheme:dark}
:root[data-theme="light"]{--bg:#F7F3EC;--surface:#FFFFFF;--raise:#FBF8F2;--line:#E6DCCD;--ink:#221B12;--ink2:#6B5E4E;--accent:#A85B00;--on-accent:#FFFFFF;--soft:rgba(168,91,0,.08);--good:#1E7B45;--bad:#C62828;color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.55;word-break:keep-all}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:1rem 1rem 6rem}
.top{display:flex;align-items:center;gap:.5rem;margin:.25rem 0 1rem}
.back{min-width:48px;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:1.25rem}
.top h1{margin:0;font-size:1.35rem;font-weight:700}
.sub{margin:.1rem 0 0;color:var(--ink2);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.1rem;margin:0 0 .85rem}
.hero{background:var(--soft);border-color:transparent}
.hero small{color:var(--ink2);font-size:.85rem}
.hero p{margin:.35rem 0 0;font-size:1.15rem;font-weight:600;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;min-height:7.2rem;padding:1rem;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left}
.tile .ic{font-size:2rem;line-height:1}
.tile b{font-size:1.05rem}
.tile span{font-size:.85rem;color:var(--ink2);line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 1.2rem;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:1.05rem}
.btn.ghost{background:var(--raise);color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
.row>.btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{min-height:48px;padding:0 1rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.muted{color:var(--ink2);font-size:.85rem}
.note{color:var(--ink2);font-size:.8rem;margin:1rem 0 0;text-align:center}
h2{font-size:1.1rem;margin:0 0 .6rem}
/* 운세 */
.stars{color:var(--accent);font-size:1.3rem;letter-spacing:.1rem}
.fl{display:grid;gap:.75rem;margin:.75rem 0 0}
.fl div{padding:.8rem .9rem;border-radius:12px;background:var(--raise)}
.fl b{display:block;font-size:.85rem;color:var(--ink2);font-weight:600}
.lucky{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.75rem;text-align:center}
.lucky div{padding:.7rem .3rem;border-radius:12px;background:var(--raise)}
.lucky small{display:block;color:var(--ink2);font-size:.78rem}
.sw{display:inline-block;width:1rem;height:1rem;border-radius:50%;vertical-align:-.15rem;margin-right:.25rem;border:1px solid var(--line)}
/* 테스트·퀴즈 */
.prog{height:8px;border-radius:99px;background:var(--raise);overflow:hidden;margin:.25rem 0 1rem}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.q{font-size:1.25rem;font-weight:700;line-height:1.5;margin:.25rem 0 1rem}
.opts{display:grid;gap:.6rem}
.opt{min-height:64px;padding:.8rem 1rem;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;font-size:1.05rem;font-weight:600;line-height:1.45}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.res-big{font-size:2.6rem;line-height:1;margin:.25rem 0}
.res-name{font-size:1.5rem;font-weight:800;margin:.25rem 0}
.axis{display:grid;gap:.5rem;margin:.75rem 0}
.axis div{display:grid;grid-template-columns:4.5rem 1fr 4.5rem;align-items:center;gap:.5rem;font-size:.85rem}
.axis div span:last-child{text-align:right}
.bar{height:10px;border-radius:99px;background:var(--raise);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:99px}
.kv{margin:.6rem 0 0;padding:.8rem .9rem;border-radius:12px;background:var(--raise)}
.kv b{display:block;font-size:.85rem;color:var(--ink2)}
/* 카드 뒤집기 */
.board{display:grid;gap:.5rem;margin:.75rem 0}
.cell{aspect-ratio:1/1;border-radius:14px;border:1px solid var(--line);background:var(--accent);font-size:2.2rem;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s}
.cell span{visibility:hidden}
.cell.open,.cell.done{background:var(--surface)}
.cell.open span,.cell.done span{visibility:visible}
.cell.done{opacity:.55}
/* 인사 카드 */
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.bgs button{padding:0;border-radius:12px;border:3px solid transparent;overflow:hidden;aspect-ratio:1/1;background:var(--raise)}
.bgs button[aria-pressed="true"]{border-color:var(--accent)}
.bgs img{width:100%;height:100%;display:block}
.msgs{display:grid;gap:.45rem}
.msgs button{min-height:52px;text-align:left;padding:.6rem .9rem;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.msgs button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.inp{width:100%;min-height:52px;padding:0 .9rem;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-size:1.05rem}
#cardOut img{width:100%;border-radius:14px;display:block;border:1px solid var(--line)}
/* 밸런스 */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:stretch}
.vs .opt{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;min-height:88px}
.vs em{font-style:normal;color:var(--ink2);align-self:center;font-weight:700}
.vs .opt.me{border-color:var(--accent);background:var(--soft)}
.pc{font-size:1.25rem;font-weight:800}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;margin-top:.6rem;background:var(--raise)}
.split i:first-child{background:var(--accent)}
.split i:last-child{background:var(--ink2);opacity:.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head><body>
<main class="wrap" id="app" aria-live="polite"></main>

function toast(m){var t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;font-weight:600;z-index:9;max-width:90%';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(function(){t.hidden=true},2400)}

var COL=[['하늘색','#7EC8E3'],['연두색','#A8D86E'],['노란색','#F6D55C'],['주황색','#F4A259'],['분홍색','#F497B6'],['보라색','#A98BD8'],['흰색','#FFFFFF'],['남색','#2E4A7D'],['초록색','#3FA66B'],['빨간색','#E05A4F'],['베이지','#E8D6B9'],['금색','#D4A843']];

function vLuck(){

function mkQuiz(kind){

  return qs.map(function(p,i){
    var rev=kind==='idiom'&&i%2===1;  /* 사자성어는 뜻→말, 말→뜻을 번갈아 */
    var ans=kind==='idiom'?(rev?p[1]:p[0]):p[1],
        q=kind==='idiom'?(rev?'"'+p[0]+'"의 뜻은?':'"'+p[1]+'"'):kind==='prov'?p[0]+' ___':p[0];
    var others=shuffle(pool.filter(function(x){return x!==p})).slice(0,3).map(function(x){return kind==='idiom'?(rev?x[1]:x[0]):x[1]});

var FR=['🍎','🍊','🍋','🍇','🍓','🍑','🍒','🍉'];

function bestLine(){var b=st().gbest||{};return (b.easy||b.hard)?'<p class="note">최고 기록 · 쉬움 '+(b.easy||'-')+'번 · 보통 '+(b.hard||'-')+'번</p>':''}
function flipCard(i){
  var g=S.g;if(!g||g.lock)return;var c=g.cells[i];if(c.open||c.done)return;
  c.open=true;g.sel.push(i);
  if(g.sel.length===2){g.moves++;var a=g.cells[g.sel[0]],b=g.cells[g.sel[1]];
    if(a.f===b.f){a.done=b.done=true;a.open=b.open=false;g.sel=[];if(!g.cells.some(function(x){return !x.done}))g.end=Date.now()}
    else{g.lock=true;render();setTimeout(function(){a.open=b.open=false;g.sel=[];g.lock=false;render()},900);return}}
  render();
}

  var m=S.clist[S.cm],img=new Image(),out=$('#cardOut');out.innerHTML='<p class="muted">만드는 중…</p>';
  img.onload=function(){
    var cv=document.createElement('canvas');cv.width=cv.height=1080;var x=cv.getContext('2d');x.drawImage(img,0,0,1080,1080);
    var dark=S.cb===2||S.cb===4?'#1E3A52':'#3B2A1E';
    x.textAlign='center';x.lineJoin='round';
    function line(t,y,size,weight){x.font=weight+' '+size+'px "IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif';wrapText(x,t,940).forEach(function(s,i){var yy=y+i*size*1.25;x.lineWidth=size/5;x.strokeStyle='rgba(255,255,255,.92)';x.strokeText(s,540,yy);x.fillStyle=dark;x.fillText(s,540,yy)})}
    var low=S.cb===5||S.cb===1;  /* 그림이 아래에 몰린 배경은 글을 위로 */
    line(m[0],low?190:930-(nm?90:0),92,'700');line(m[1],low?300:1010-(nm?90:0)+12,56,'600');
    if(nm){x.font='600 48px "IBM Plex Sans KR",sans-serif';x.lineWidth=10;x.strokeStyle='rgba(255,255,255,.92)';x.strokeText(nm,540,1035);x.fillStyle=dark;x.fillText(nm,540,1035)}
    x.textAlign='right';x.font='600 26px "IBM Plex Sans KR",sans-serif';x.fillStyle='rgba(0,0,0,.35)';x.fillText('리딩노트',1050,1062);
    cv.toBlob(function(b){S.cblob=b;var u=URL.createObjectURL(b);
      out.innerHTML='<img src="'+u+'" alt="'+esc(m[0]+' '+m[1])+' 인사 카드"><p class="muted" style="text-align:center">사진을 꾹 누르면 저장하거나 보낼 수 있어요</p><div class="row"><button class="btn" data-share="card">카톡으로 보내기</button><a class="btn ghost" href="'+u+'" download="good-morning.png">사진 저장</a></div>';
      out.scrollIntoView({behavior:'smooth',block:'start'})},'image/png');
  };
  img.onerror=function(){out.innerHTML='<p class="muted">카드를 만들지 못했어요. 다시 눌러 주세요.</p>'};
  (document.fonts&&document.fonts.ready||Promise.resolve()).then(function(){img.src=bgUrl(S.cb)});
}

/* ---------- 밸런스 게임 ---------- */
/* 하루 3문제가 날짜에 따라 바뀌어요. 표는 서버(fun_vote)에 익명 기기 번호로 하나만 남아요. 서버가 없으면 내 선택만 보여요. */
var BAL=[['jjajang','짜장면','짬뽕'],['bumuk','탕수육 부먹','탕수육 찍먹'],['season','여름','겨울'],['trip','산','바다'],['morning','아침형','저녁형'],['allin','한 종목 몰빵','여러 종목 분산'],['term','단타','장기 투자'],['ramen','라면에 계란 넣는다','안 넣는다'],['music','트로트','발라드'],['live','도시 생활','시골 생활'],['coffee','믹스커피','아메리카노'],['travel','국내 여행','해외 여행'],['money','현금','금'],['news','종이 신문','휴대폰 뉴스'],['tv','드라마','예능'],['rice','흰쌀밥','잡곡밥'],['pay','현금 결제','카드 결제'],['walk','혼자 산책','같이 산책'],['plan','여행은 계획대로','여행은 발길 닿는 대로'],['sleep','일찍 자고 일찍 일어나기','늦게 자고 늦게 일어나기'],['broadcast','방송 생방송으로 보기','다시 보기로 몰아 보기'],['sell','목표가 오면 바로 판다','조금 더 기다려 본다'],['memo','손으로 쓰는 메모','휴대폰 메모'],['soup','된장찌개','김치찌개'],['call','전화가 편하다','문자가 편하다'],['gift','선물은 현금','선물은 물건']];
function balToday(){var s=hash(today()+'|bal'),a=shuffle(BAL,s);return a.slice(0,3)}
function devId(){var o=st();if(!o.dev){o.dev=Math.random().toString(36).slice(2)+Date.now().toString(36);put('dev',o.dev)}return o.dev}
function vBal(){
  var h=top('밸런스 게임','오늘의 3문제 · 매일 바뀌어요'),mine=st().bal||{},T=S.tally||{};
  if(!S.talLoad){S.talLoad=1;loadTally()}
  h+=balToday().map(function(b){var me=mine[b[0]],t=T[b[0]],tot=t?t[0]+t[1]:0;
    var p0=tot?Math.round(t[0]/tot*100):null;
    return '<section class="card"><div class="vs"><button class="opt'+(me===0?' me':'')+'" data-bal="'+b[0]+':0"><span>'+esc(b[1])+'</span>'+(me!=null&&p0!=null?'<span class="pc">'+p0+'%</span>':'')+'</button><em>VS</em><button class="opt'+(me===1?' me':'')+'" data-bal="'+b[0]+':1"><span>'+esc(b[2])+'</span>'+(me!=null&&p0!=null?'<span class="pc">'+(100-p0)+'%</span>':'')+'</button></div>'+
      (me!=null?(p0!=null?'<div class="split" aria-hidden="true"><i style="width:'+p0+'%"></i><i style="width:'+(100-p0)+'%"></i></div><p class="muted" style="margin:.5rem 0 0">'+tot.toLocaleString('ko-KR')+'명이 골랐어요 · 다시 누르면 바꿀 수 있어요</p>':'<p class="muted" style="margin:.5rem 0 0">골랐어요! 다른 분들 결과는 잠시 뒤에 보여요</p>'):'')+'</section>'}).join('');
  return h+'<p class="note">내일 새 문제가 나와요. 고른 결과는 이름 없이 숫자로만 모여요.</p>';
}
function q(p){return Promise.resolve(p).then(function(r){return r||{}},function(e){return {error:e}})}
function loadTally(){var c=sb();if(!c)return;q(c.rpc('fun_tally',{p_topics:balToday().map(function(b){return b[0]})})).then(function(r){if(r.error||!r.data)return;S.tally=r.data;if(ROUTE==='bal')render()})}
function vote(id,ch){var o=st().bal||{};o[id]=ch;put('bal',o);render();var c=sb();if(!c)return;
  q(c.rpc('fun_vote',{p_topic:id,p_dev:devId(),p_choice:ch})).then(function(r){if(r.error||!r.data)return;S.tally=S.tally||{};S.tally[id]=r.data;if(ROUTE==='bal')render()})}

/* ---------- 공유 (카톡 등) ---------- */
function siteBase(){try{return (parent.location.origin+parent.location.pathname).replace(/index\.html$/,'')}catch(e){return location.href.replace(/fun\.html.*$/,'')}}
function share(kind){
  var url=siteBase()+'#fun/'+(kind==='test'?'test-'+S.tcode:kind==='quiz'?'quiz':'home'),T=kind==='test'?TYPES[S.tcode]:null;
  var text=kind==='test'?'나는 '+T[0]+' "'+T[1]+'" 이래요! 당신은 어떤 주식쟁이?':kind==='quiz'?'두뇌 퀴즈 '+S.qok+'점 나왔어요. 저보다 잘할 수 있어요?':'오늘도 좋은 하루 되세요';
  if(kind==='card'&&S.cblob&&navigator.canShare){var f=new File([S.cblob],'good-morning.png',{type:'image/png'});if(navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}}
  if(kind==='card'){toast('사진을 꾹 눌러 저장한 뒤 카톡에서 보내 주세요');return}
  if(navigator.share){navigator.share({title:'리딩노트 놀이터',text:text,url:url}).catch(function(){});return}
  var t=text+'\n'+url;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('복사했어요. 카톡에 붙여 넣어 보내세요')},function(){prompt('아래 글을 복사해서 보내 주세요',t)});
}

/* ---------- 화면 그리기·이동 ---------- */
var V={home:vHome,luck:vLuck,test:vTest,quiz:vQuiz,game:vGame,card:vCard,bal:vBal};
function render(){$('#app').innerHTML=(V[ROUTE]||vHome)()}
function go(r,opt){
  var m=/^test-([01]{4})$/.exec(r||'');
  if(m){ROUTE='test';S.tcode=m[1];S.tscore=null;S.tshared=true}
  else{ROUTE=V[r]?r:'home';if(ROUTE==='test'&&S.tshared){S.tcode=null;S.tshared=false}}
  render();window.scrollTo(0,0);
  if(!(opt&&opt.quiet))send('route','',ROUTE==='test'&&S.tcode&&S.tshared?'test-'+S.tcode:ROUTE);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button,a');if(!b)return;var d=b.dataset;
  if(d.x){e.preventDefault();var x=d.x.split(':');send(x[0],x[1],x.slice(2).join(':'));return}
  if(d.go){go(d.go);return}
  if(d.z!=null){put('zodiac',+d.z);render();return}
  if(d.t==='start'){S.ti=0;S.tans=[];render();return}
  if(d.t==='prev'){S.ti=Math.max(0,S.ti-1);render();return}
  if(d.t==='restart'){S.tcode=null;S.tshared=false;S.ti=0;S.tans=[];render();send('route','','test');return}
  if(d.a!=null&&ROUTE==='test'){tAnswer(+d.a);return}
  if(d.qk){S.qk=d.qk;S.qs=mkQuiz(d.qk);S.qi=0;S.qok=0;S.qpick=null;render();return}
  if(d.qa!=null&&S.qpick==null){S.qpick=+d.qa;if(S.qs[S.qi].opts[S.qpick]===S.qs[S.qi].ans)S.qok++;render();return}
  if(d.q==='next'){S.qi++;S.qpick=null;render();window.scrollTo(0,0);return}
  if(d.q==='menu'){S.qk=null;render();return}
  if(d.lv){newGame(d.lv);render();return}
  if(d.g==='menu'){S.g=null;render();return}
  if(d.c!=null){flipCard(+d.c);return}
  if(d.cb!=null){S.cb=+d.cb;S.cn=($('#cname')||{}).value;render();return}
  if(d.cm!=null){S.cm=+d.cm;S.cn=($('#cname')||{}).value;render();return}
  if(d.cardmake){makeCard();return}
  if(d.share){share(d.share);return}
  if(d.bal){var p=d.bal.split(':');vote(p[0],+p[1]);return}
});
function siteCfg(){try{return JSON.parse(localStorage.getItem('site.v1'))||{}}catch(e){return {}}}
window.__site={
  apply:function(c){document.documentElement.setAttribute('data-theme',c&&c.theme==='dark'?'dark':'light')},
  go:function(r){go(r||'home',{quiet:true})}
};
window.__site.apply(siteCfg());
var h0=(location.hash||'').replace(/^#\/?/,'');go(h0||'home',{quiet:true});
})();
</script>
