<!doctype html><html lang="ko"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body><title>커뮤니티</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
/* Layout: 휴대폰 한 손 앱 — 매주 하나의 양자택일 아젠다(배너 → 본문), 매일 예측, 뽑힌 의견. 두 선택지는 늘 연두(가)·파랑(나) 한 쌍으로 표시 */
:root{
  --bg:#0B0F14; --surface:#11171E; --raise:#161D25; --line:#222B35; --ink:#EEF2F5; --ink2:#8D99A6;
  --accent:#C6F25E; --on-accent:#0B0F14; --live:#FF5A5F;
  --sa:#78A02A; --sb:#5B85EB; --sa-soft:rgba(120,160,42,.16); --sb-soft:rgba(91,133,235,.16);
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono','IBM Plex Sans KR',ui-monospace,Menlo,monospace;
  --nav-h:4.25rem;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F5F7; --surface:#FFFFFF; --raise:#F8F9FA; --line:#D9DFE5; --ink:#0D1117; --ink2:#56616D;
  --accent:#3F6F00; --on-accent:#FFFFFF; --live:#D42A26;
  --sa:#4C7A00; --sb:#2F5FCC; --sa-soft:rgba(76,122,0,.1); --sb-soft:rgba(47,95,204,.1); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F5F7; --surface:#FFFFFF; --raise:#F8F9FA; --line:#D9DFE5; --ink:#0D1117; --ink2:#56616D;
  --accent:#3F6F00; --on-accent:#FFFFFF; --live:#D42A26;
  --sa:#4C7A00; --sb:#2F5FCC; --sa-soft:rgba(76,122,0,.1); --sb-soft:rgba(47,95,204,.1); color-scheme:light}

*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:1rem;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;word-spacing:-.3em}
.gx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 2rem)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{min-height:4rem;display:flex;align-items:center;gap:.5rem}
.mark{display:flex;flex-direction:column;gap:.25rem}
.mark b{font-size:1.375rem;font-weight:700;letter-spacing:-.04em;line-height:1}
.mark b i{font-style:normal;font-weight:400;color:var(--ink2)}
.mark small{font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.14em;color:var(--ink2);line-height:1}
.back{width:2.75rem;height:2.75rem;margin-left:-.6rem;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.back svg{width:1.5rem;height:1.5rem}
.top-title{font-size:1.125rem;font-weight:700;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:var(--nav-h);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-size:.8125rem;font-weight:500;color:var(--ink2)}
.nav button svg{width:1.5rem;height:1.5rem}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}

main{display:flex;flex-direction:column;gap:2rem;padding-top:.5rem}
.sec{display:flex;flex-direction:column;gap:.85rem}
.sech{display:flex;align-items:baseline;gap:.5rem;font-size:1.25rem;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.sech .meta{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;font-weight:500;color:var(--ink2);letter-spacing:.04em;white-space:nowrap}
.lbl{font-family:var(--f-mono);font-size:.75rem;font-weight:500;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase;word-spacing:-.3em}
.lbl.acc{color:var(--accent)}
.small{font-size:.875rem;color:var(--ink2);line-height:1.55}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.75rem}
.btn{min-height:3.25rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:0 1rem;border-radius:.5rem;border:0;font-size:1rem;font-weight:700}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-block{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.link{border:0;background:transparent;padding:0;font-family:var(--f-mono);font-size:.8125rem;color:var(--accent);word-spacing:-.3em;min-height:2.25rem}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:2px;flex-shrink:0}
.dot.a{background:var(--sa)} .dot.b{background:var(--sb)}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.05rem .5rem;border:1px solid var(--line);border-radius:.3rem;font-size:.8125rem;font-weight:500;color:var(--ink2);white-space:nowrap}

/* 아젠다 배너 */
.banner{display:flex;flex-direction:column;gap:1rem;width:100%;padding:1.1rem 1.1rem 1rem;text-align:left;border-radius:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.banner h2{font-size:1.5rem;font-weight:700;line-height:1.35;letter-spacing:-.04em;text-wrap:balance}
.brow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.brow .lbl:last-child{margin-left:auto}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:.4rem}
.vs>span{display:flex;flex-direction:column;gap:.1rem;padding:.7rem .8rem;border-radius:.5rem;min-width:0}
.vs .va{background:var(--sa-soft);border-left:3px solid var(--sa)}
.vs .vb{background:var(--sb-soft);border-right:3px solid var(--sb);text-align:right}
.vs b{font-size:1.1875rem;letter-spacing:-.03em}
.vs small{font-size:.8125rem;color:var(--ink2)}
.vs i{align-self:center;font-style:normal;font-family:var(--f-mono);font-size:.8125rem;color:var(--ink2)}
.bfoot{display:flex;align-items:center;gap:.6rem;font-size:.875rem;color:var(--ink2)}
.bfoot .go{margin-left:auto;font-family:var(--f-mono);font-size:.8125rem;color:var(--accent);white-space:nowrap;word-spacing:-.3em}

/* 나뉜 막대 */
.split{display:flex;gap:2px;height:.75rem;width:100%}
.split span{display:block;height:100%}
.split .a{background:var(--sa);border-radius:4px 0 0 4px}
.split .b{background:var(--sb);border-radius:0 4px 4px 0}
.split-lab{display:flex;justify-content:space-between;gap:.5rem;font-size:.875rem;font-weight:600}
.split-lab span{display:flex;align-items:center;gap:.35rem}
.locked{display:flex;align-items:center;gap:.5rem;padding:.75rem .9rem;border:1px dashed var(--line);border-radius:.5rem;font-size:.9375rem;color:var(--ink2)}
.locked svg{width:1.1rem;height:1.1rem;flex-shrink:0}

/* 오늘의 예측 */
.pred{padding:1rem;display:flex;flex-direction:column;gap:.85rem}
.pred h3{font-size:1.1875rem;font-weight:700;letter-spacing:-.03em;line-height:1.4}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.pick{min-height:3.5rem;border-radius:.5rem;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;gap:.4rem;font-size:1.0625rem;font-weight:700}
.pick.a{background:var(--sa-soft);border-color:var(--sa)}
.pick.b{background:var(--sb-soft);border-color:var(--sb)}
.pick[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.pick svg{width:1rem;height:1rem}
.yrow{display:flex;align-items:flex-start;gap:.6rem;padding-top:.75rem;border-top:1px solid var(--line);font-size:.875rem;color:var(--ink2)}
.yrow b{color:var(--ink)}
.strip{display:flex;gap:4px}
.strip span{width:1.4rem;height:1.4rem;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.6875rem;color:var(--ink2)}
.strip .h{background:var(--sa)} .strip .m{border:1px solid var(--ink2)} .strip .n{border:1px dashed var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:.35rem .9rem;font-size:.8125rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.lg-h{width:.7rem;height:.7rem;border-radius:2px;background:var(--sa)} .lg-m{width:.7rem;height:.7rem;border-radius:2px;border:1px solid var(--ink2)} .lg-n{width:.7rem;height:.7rem;border-radius:2px;border:1px dashed var(--ink2)}

/* 뽑힌 의견 */
.quotes{display:flex;gap:.6rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-block:.1rem}
.quotes::-webkit-scrollbar{display:none}
.q{flex:0 0 82%;scroll-snap-align:start;display:flex;flex-direction:column;gap:.6rem;padding:1rem;border-radius:.75rem;border:1px solid var(--line);background:var(--surface);min-width:0}
.q.mine{border-color:var(--accent)}
.q-who{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.875rem;color:var(--ink2)}
.q-who b{color:var(--ink);font-size:.9375rem}
.q-text{font-size:1.0625rem;line-height:1.65;letter-spacing:-.01em}
.q-text::before{content:"“";color:var(--ink2);margin-right:.1em}
.q-text::after{content:"”";color:var(--ink2);margin-left:.1em}
.q-foot{display:flex;align-items:center;gap:.5rem;font-size:.8125rem;color:var(--ink2);margin-top:auto}
.picked{display:inline-flex;align-items:center;gap:.25rem;padding:.05rem .45rem;border-radius:.3rem;background:var(--accent);color:var(--on-accent);font-size:.75rem;font-weight:700}
.qstack{display:flex;flex-direction:column;gap:.6rem}
.qstack .q{flex:none}

.report{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center;width:100%;padding:1rem;text-align:left;border-radius:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.report h3{font-size:1.0625rem;font-weight:700;line-height:1.45;letter-spacing:-.02em}
.report .rt{display:flex;flex-direction:column;gap:.3rem;min-width:0}

.cand{display:flex;flex-direction:column;gap:.35rem;width:100%;padding:.85rem 1rem;border:0;background:transparent;text-align:left;color:var(--ink)}
.cand+.cand{border-top:1px solid var(--line)}
.cand .ct{display:flex;align-items:center;gap:.5rem;font-size:1rem;font-weight:600}
.cand .ct .mono{margin-left:auto;font-size:.875rem;color:var(--ink2);font-weight:500}
.cand .cbar{height:.5rem;border-radius:0 4px 4px 0;background:var(--ink2);opacity:.45}
.cand[aria-pressed="true"] .cbar{background:var(--accent);opacity:1}
.cand[aria-pressed="true"] .ct::after{content:"내 선택";order:-1;font-family:var(--f-mono);font-size:.6875rem;padding:0 .35rem;border-radius:.25rem;background:var(--accent);color:var(--on-accent)}

.cele{display:flex;flex-direction:column;gap:.6rem;padding:1rem;border-radius:.75rem;border:1px solid var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface))}
.cele b{font-size:1.0625rem}

/* 본문 */
.art{display:flex;flex-direction:column;gap:1.75rem}
.art h1{font-size:1.625rem;font-weight:700;line-height:1.35;letter-spacing:-.045em;text-wrap:balance}
.art h2{font-size:1.1875rem;font-weight:700;letter-spacing:-.03em;line-height:1.4}
.art p{font-size:1.0625rem;line-height:1.75;color:var(--ink)}
.art p.dim{color:var(--ink2)}
.prose{display:flex;flex-direction:column;gap:.8rem;max-width:36rem}
.metas{display:flex;flex-wrap:wrap;gap:.4rem}
.fig{display:flex;flex-direction:column;gap:.75rem;padding:1rem;border-radius:.75rem;border:1px solid var(--line);background:var(--surface)}
.fig figcaption{display:flex;flex-direction:column;gap:.15rem}
.fig figcaption b{font-size:1.0625rem;letter-spacing:-.02em}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--ink2)}
.chart .end{font-family:var(--f-ui);font-size:12px;font-weight:600;fill:var(--ink)}
.chart .grid{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;padding:.45rem .6rem;border-radius:.4rem;background:var(--raise);border:1px solid var(--line);font-size:.8125rem;line-height:1.5;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tip[hidden]{display:none}
.cwrap{position:relative}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.tile{display:flex;flex-direction:column;gap:.2rem;padding:.75rem .8rem;border-radius:.5rem;background:var(--raise);border:1px solid var(--line);min-width:0}
.tile .tk{font-size:.8125rem;color:var(--ink2);display:flex;align-items:center;gap:.35rem}
.tile b{font-family:var(--f-mono);font-size:1.25rem;font-weight:500;letter-spacing:-.02em;word-spacing:-.3em}
.tile span.s{font-size:.75rem;color:var(--ink2)}
details.tbl{font-size:.875rem}
details.tbl summary{cursor:pointer;color:var(--ink2);font-family:var(--f-mono);font-size:.75rem;word-spacing:-.3em;min-height:2rem;display:flex;align-items:center}
.tw{overflow-x:auto}
.tw table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tw th,.tw td{padding:.4rem .5rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tw th:first-child,.tw td:first-child{text-align:left}
.tw th{color:var(--ink2);font-weight:500}
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.side{display:flex;flex-direction:column;gap:.6rem;padding:.9rem;border-radius:.5rem;min-width:0}
.side.a{background:var(--sa-soft);border-top:3px solid var(--sa)}
.side.b{background:var(--sb-soft);border-top:3px solid var(--sb)}
.side b{font-size:1rem}
.side li{font-size:.9375rem;line-height:1.6;padding-left:.9rem;position:relative}
.side li::before{content:"";position:absolute;left:0;top:.65em;width:.35rem;height:1px;background:var(--ink2)}
@media (max-width:360px){.sides{grid-template-columns:1fr}}
.votebox{display:flex;flex-direction:column;gap:.75rem;padding:1rem;border-radius:.75rem;border:1px solid var(--accent);background:var(--surface)}
.votebox h2{font-size:1.1875rem}
.field{width:100%;min-height:5rem;padding:.75rem .9rem;border-radius:.5rem;border:1px solid var(--line);background:var(--bg);font-size:1rem;line-height:1.55;resize:vertical}
.field:focus{outline:none;border-color:var(--accent)}
.cnt{align-self:flex-end;font-family:var(--f-mono);font-size:.75rem;color:var(--ink2)}
.done{display:flex;flex-direction:column;gap:.35rem;padding:.8rem .9rem;border-radius:.5rem;background:var(--raise);font-size:.9375rem}
.done b{font-size:1rem}
.ages{display:flex;flex-direction:column;gap:.85rem}
.age{display:flex;flex-direction:column;gap:.3rem}
.age-t{display:flex;align-items:baseline;gap:.5rem;font-size:.875rem}
.age-t b{font-size:.9375rem}
.age-t .mono{margin-left:auto;color:var(--ink2);font-size:.8125rem}
.age.me .age-t b::after{content:" · 내 나이대";color:var(--accent);font-weight:500;font-size:.8125rem}
.kw{display:flex;flex-wrap:wrap;gap:.45rem;align-items:baseline}
.kw span{display:inline-flex;align-items:baseline;gap:.3rem;padding:.2rem .6rem;border-radius:.4rem;border:1px solid var(--line);font-weight:600;line-height:1.4}
.kw span small{font-family:var(--f-mono);font-size:.6875rem;font-weight:500;color:var(--ink2)}
.kw span i{display:inline-block;width:.5rem;height:.5rem;border-radius:2px;align-self:center}
.ops-ctl{display:flex;gap:.4rem;flex-wrap:wrap}
.tab{min-height:2.5rem;padding:0 .8rem;border-radius:.4rem;border:1px solid var(--line);background:transparent;font-size:.875rem;font-weight:500;color:var(--ink2)}
.tab[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.op{display:flex;flex-direction:column;gap:.45rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.op.mine .op-text{color:var(--ink)}
.op-who{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.8125rem;color:var(--ink2)}
.op-who b{color:var(--ink);font-size:.875rem}
.op-text{font-size:1rem;line-height:1.65}
.like{align-self:flex-start;display:inline-flex;align-items:center;gap:.3rem;min-height:2.25rem;padding:0 .7rem;border-radius:.4rem;border:1px solid var(--line);background:transparent;font-family:var(--f-mono);font-size:.8125rem;color:var(--ink2)}
.like svg{width:.95rem;height:.95rem}
.like[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.note{padding:.75rem .9rem;border-radius:.5rem;background:var(--raise);font-size:.8125rem;color:var(--ink2);line-height:1.6}

/* 목록·일정 */
.alist{display:flex;flex-direction:column}
.arow{display:flex;flex-direction:column;gap:.5rem;width:100%;padding:1rem 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--ink)}
.arow h3{font-size:1.0625rem;font-weight:700;letter-spacing:-.02em;line-height:1.45}
.arow .brow{font-size:.8125rem;color:var(--ink2)}
.plan{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.75rem;padding:.8rem 0;border-bottom:1px solid var(--line)}
.prow .when{font-family:var(--f-mono);font-size:.8125rem;color:var(--ink2);line-height:1.5;word-spacing:-.3em}
.prow .what{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.prow .what b{font-size:.9375rem;line-height:1.5}
.prow.now .when{color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.35rem}
.week div{display:flex;flex-direction:column;gap:.2rem;padding:.55rem .4rem;border-radius:.4rem;background:var(--raise);border:1px solid var(--line);min-width:0;text-align:center}
.week .d{font-family:var(--f-mono);font-size:.75rem;color:var(--ink2)}
.week b{font-size:.8125rem;line-height:1.35;word-break:keep-all}
.week .today{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + .75rem);width:calc(100% - 2rem);max-width:440px;z-index:50;padding:.85rem 1rem;border-radius:.5rem;background:var(--ink);color:var(--bg);font-size:.9375rem;font-weight:600;line-height:1.5}
.toast[hidden]{display:none}
.nav[hidden]{display:none}
.app.in-chat{padding-bottom:calc(10.5rem + env(safe-area-inset-bottom,0px))}
.app.in-chat .toast{bottom:calc(10rem + env(safe-area-inset-bottom,0px))}
/* 실시간 토론 */
.live{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--live);flex-shrink:0;align-self:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.livebox{display:flex;flex-direction:column;gap:0;width:100%;padding:0;text-align:left;border-radius:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);overflow:hidden}
.lp{display:flex;flex-direction:column;gap:.15rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);min-width:0}
.lp-who{display:flex;align-items:center;gap:.35rem;font-size:.8125rem;color:var(--ink2)}

  h+='<section class="sec"><h2 class="sech">요일별 오늘의 예측</h2><div class="week">'+DAILY.map(function(d,i){return '<div class="'+(i===0?'today':'')+'"><span class="d">'+d[0]+'</span><b>'+d[1]+'</b></div>'}).join('')+'</div>'+
    '<p class="small">매일 장 시작 전에 열고, 장 마감에 닫고, 다음 날 오전 9시에 채점해요. 금요일 리포트에서 한 주 예측 왕을 소개해요.</p></section>';
  h+='<section class="sec"><h2 class="sech">한 주의 흐름</h2><div class="plan">'+
    [['월 오전','토론 주제 공개 · 홈 배너'],['월~금','투표 · 이유 한 줄 · 공감'],['수 저녁','중간 결과 알림 ("지금 62%가 배당주")'],['금 오후 6시','마감 · 뽑힌 의견 5개 선정'],['토 오전','결과 리포트 발행 · 뽑힌 분께 알림']].map(function(r){return '<div class="prow"><span class="when">'+r[0]+'</span><span class="what"><b>'+r[1]+'</b></span></div>'}).join('')+'</div></section>';
  return h;
}

/* ===== 화면: 내 기록 ===== */
function viewMe(){
  var hits=P.myPred.filter(function(v){return v===1}).length,tried=P.myPred.filter(function(v){return v!==null}).length,h='';
  h+='<section class="sec"><h2 class="sech">내 참여<span class="meta">예시 기록 포함</span></h2><div class="stats">'+
    '<div class="tile"><span class="tk">참여한 토론</span><b>'+(3+(P.vote?1:0))+'개</b><span class="s">지난 3주 + 이번 주</span></div>'+
    '<div class="tile"><span class="tk">남긴 의견</span><b>'+(2+(P.myOp?1:0))+'개</b><span class="s">공감 받은 수 41</span></div>'+
    '<div class="tile"><span class="tk">뽑힌 의견</span><b>'+(P.picked?1:0)+'개</b><span class="s">'+(P.picked?'이번 주 선정':'아직 없어요')+'</span></div>'+
    '<div class="tile"><span class="tk">예측 적중률</span><b>'+Math.round(hits/tried*100)+'%</b><span class="s">'+tried+'번 중 '+hits+'번</span></div></div></section>';
  h+='<section class="sec"><h2 class="sech">예측 기록</h2><div class="card pred">'+predStrip(P.myPred,!!P.pred)+'<div class="legend"><span><i class="lg-h"></i>적중</span><span><i class="lg-m"></i>빗나감</span><span><i class="lg-n"></i>참여 안 함·채점 전</span></div>'+
    '<p class="small">다수 의견의 최근 10일 적중: '+PRED.crowd.filter(function(v){return v}).length+'번. 회원님은 다수보다 '+(hits/tried*10>=PRED.crowd.filter(function(v){return v}).length?'잘':'덜')+' 맞혔어요.</p></div></section>';
  h+='<section class="sec"><h2 class="sech">뽑힌 의견 미리 보기</h2><p class="small">의견이 뽑히면 홈 맨 위와 결과 리포트에 이렇게 실려요.</p>'+
    (P.picked?'<button class="btn btn-line btn-block" data-act="unpick">미리 보기 끄기</button>':'<button class="btn btn-primary btn-block" data-act="pickme">내 의견이 뽑혔다고 가정하고 보기</button>')+
    (P.myOp?'':'<p class="small">이번 주 토론에 이유를 남기면 그 글로 보여드려요. 아직 없으면 예시 문장으로 보여드려요.</p>')+'</section>';
  h+='<section class="sec"><button class="btn btn-line btn-block" data-act="reset">처음 상태로 되돌리기 (예시용)</button></section>';
  return h;
}

/* ===== 그리기 ===== */
/* 현재 위치 표시: 서비스 › 탭 › 기능 (마지막이 지금 화면) */
function crumbHTML(items){
  if(!items||items.length<2)return '';
  return '<nav class="crumb" aria-label="현재 위치"><ol class="gx">'+items.map(function(it,i){
    var last=i===items.length-1;
    return '<li>'+(i?'<span class="sep" aria-hidden="true">›</span>':'')+(last?'<span aria-current="page">'+esc(it.t)+'</span>':'<button type="button" '+it.attr+'>'+(i===0?'<i class="cdot" aria-hidden="true"></i>':'')+esc(it.t)+'</button>')+'</li>';
  }).join('')+'</ol></nav>';
}
var CM_TAB={home:'홈',agendas:'토론 목록',me:'내 활동'},CM_VIEW={detail:'이번 주 토론',report:'결과 리포트',chat:'실시간 토론'};
function cmCrumb(){
  var v=S.view;if(v==='home'||!v)return '';
  var it=[{t:'커뮤니티',attr:'data-tab="home"'}];
  if(CM_TAB[v]){it.push({t:CM_TAB[v]});return crumbHTML(it)}
  S.stack.forEach(function(x,i){
    if(CM_TAB[x]){if(x!=='home')it.push({t:CM_TAB[x],attr:'data-tab="'+x+'"'})}
    else if(CM_VIEW[x])it.push({t:CM_VIEW[x],attr:'data-act="crumb" data-v="'+i+'"'});
  });
  it.push({t:CM_VIEW[v]||''});
  return crumbHTML(it);
}
function render(){
  var v=S.view,title={detail:'이번 주 토론',report:'결과 리포트',chat:'실시간 토론'}[v];
  document.getElementById('top').innerHTML=title?'<button class="back" data-act="back" aria-label="뒤로">'+I.back+'</button><h1 class="top-title">'+title+'</h1>'+(v==='chat'?'<span class="meta" style="margin-left:auto;display:flex;align-items:center;gap:.4rem;font-family:var(--f-mono);font-size:.8125rem;color:var(--ink2)"><i class="live"></i><span id="chat-on">'+S.online+'명</span></span>':''):
    '<span class="hm"><span class="hm-logo" aria-hidden="true">'+I.ag+'</span><span class="hm-t"><b>커뮤니티</b><small>이번 주 토론 · 의견 · 실시간 대화</small></span></span>';
  var cr=cmCrumb();document.getElementById('crumb').innerHTML=cr;document.querySelector('.app').classList.toggle('has-crumb',!!cr);
  document.getElementById('main').innerHTML=v==='chat'?viewChat():v==='detail'?viewDetail():v==='report'?viewReport():v==='agendas'?viewAgendas():v==='me'?viewMe():viewHome();
  var tab=v==='detail'||v==='report'||v==='chat'?(S.stack[0]||'home'):v;
  document.querySelector('.nav').hidden=v==='chat';
  document.querySelector('.app').classList.toggle('in-chat',v==='chat');
  var oc=document.getElementById('composer');if(oc)oc.remove();var op=document.getElementById('newpill');if(op)op.remove();
  if(v==='chat'){document.body.insertAdjacentHTML('beforeend',composerHTML());S.unseen=0;setTimeout(toBottom,0)}
  document.getElementById('nav').innerHTML=[['home','홈',I.home],['agendas','토론 목록',I.ag],['me','내 활동',I.me]].map(function(n){return '<button data-tab="'+n[0]+'"'+(tab===n[0]?' aria-current="page"':'')+'>'+n[2]+n[1]+'</button>'}).join('');
  bindChart();
  reportRoute(v);
}
/* 웹 주소 연동: 지금 화면을 셸에 알려 주소(#서비스/화면)·뒤로 가기·새 탭 열기가 되게 해요 */
var LAST_ROUTE='';
function reportRoute(r){if(r===LAST_ROUTE)return;LAST_ROUTE=r;if(window.parent!==window)try{parent.postMessage({site:1,type:'route',app:'',route:r},'*')}catch(e){}}
function go(v){S.stack.push(S.view);S.view=v;render();if(v!=='chat')window.scrollTo(0,0)}
var tt=null;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2800)}
function bindChart(){
  var hit=document.getElementById('lc-hit');if(!hit)return;
  var svg=hit.ownerSVGElement,tip=document.getElementById('lc-tip'),xl=document.getElementById('lc-x');
  function show(ev){var r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,sx=(ev.clientX-r.left)/r.width*vb.width,t=Math.max(0,Math.min(10,Math.round((sx-34)/(320-34-84)*10))),p=SERIES[t],x=34+t/10*(320-34-84);
    xl.setAttribute('x1',x);xl.setAttribute('x2',x);xl.setAttribute('visibility','visible');
    tip.innerHTML='<b>'+(t?t+'년 뒤':'지금')+'</b><br><i class="dot a"></i> 배당주 '+p.a.toFixed(2)+'억 <span class="small">(받은 배당 '+Math.round(p.cash*10000).toLocaleString('ko-KR')+'만)</span><br><i class="dot b"></i> 성장주 '+p.b.toFixed(2)+'억';
    tip.hidden=false;var px=x/vb.width*r.width;tip.style.left=Math.min(Math.max(px-90,0),r.width-190)+'px';tip.style.top='0px';}
  hit.addEventListener('pointermove',show);hit.addEventListener('pointerdown',show);
  hit.addEventListener('pointerleave',function(){tip.hidden=true;xl.setAttribute('visibility','hidden')});
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-go],[data-act],[data-tab]');if(!b)return;
  if(b.dataset.tab){S.stack=[];S.view=b.dataset.tab;render();window.scrollTo(0,0);return}
  if(b.dataset.go){go(b.dataset.go);return}
  var a=b.dataset.act,v=b.dataset.v;
  if(a==='back'){S.view=S.stack.pop()||'home';render();window.scrollTo(0,0)}
  else if(a==='crumb'){var ci=+v;S.view=S.stack[ci];S.stack=S.stack.slice(0,ci);render();window.scrollTo(0,0)}
  else if(a==='vote'){var first=!P.vote;P.vote=v;if(P.myOp)P.myOp.side=v;save();render();if(first){toast('투표했어요. 결과가 열렸어요');var el=document.getElementById('vote');if(el)el.scrollIntoView({block:'start'})}}
  else if(a==='post'){var t=(document.getElementById('reason').value||'').trim();if(t.length<4){toast('이유를 4자 이상 적어 주세요');return}
    P.myOp={id:'me',name:'나',age:P.age,side:P.vote,like:0,mine:true,text:t};P.reason='';save();render();toast('의견을 남겼어요. 금요일에 뽑힌 의견을 발표해요');}
  else if(a==='age'){P.age=v;if(P.myOp)P.myOp.age=v;save();render()}
  else if(a==='like'){if(P.likes[v])delete P.likes[v];else P.likes[v]=1;save();render()}
  else if(a==='sort'){S.sort=v;render()}
  else if(a==='side'){S.side=v;render()}
  else if(a==='pred'){var f=!P.pred;P.pred=v;save();render();toast(f?'예측했어요. 내일 오전 9시에 채점해요':'예측을 바꿨어요')}
  else if(a==='cand'){P.cand=P.cand===+v?null:+v;save();render()}
  else if(a==='pickme'){P.picked=true;save();S.stack=[];S.view='home';render();window.scrollTo(0,0);toast('알림: 회원님의 의견이 이번 주 뽑힌 의견에 올랐어요')}
  else if(a==='unpick'){P.picked=false;save();render()}
  else if(a==='clike'){P.clikes=P.clikes||{};if(P.clikes[v])delete P.clikes[v];else P.clikes[v]=1;save();var m=S.chat.filter(function(x){return x.id===v})[0];var el=document.getElementById('cm-'+v);if(m&&el)el.outerHTML=chatMsg(m)}
  else if(a==='reply'){var i=document.getElementById('chat-in');i.value='@'+v+' ';S.draft=i.value;i.focus()}
  else if(a==='chip'){var i2=document.getElementById('chat-in');i2.value=(i2.value?i2.value.replace(/\s*$/,' '):'')+v;S.draft=i2.value;i2.focus()}
  else if(a==='newpill'){S.unseen=0;b.hidden=true;toBottom()}
  else if(a==='tovote'){S.stack=['home'];S.view='detail';render();var vb=document.getElementById('vote');if(vb)vb.scrollIntoView({block:'start'})}
  else if(a==='reset'){P=defaults();save();S.chat=CHAT_SEED.map(function(m){return Object.assign({},m)});S.view='home';S.stack=[];S.sort='like';S.side='all';render();window.scrollTo(0,0);toast('처음 상태로 되돌렸어요')}
});
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='chat-form')return;ev.preventDefault();
  var i=document.getElementById('chat-in'),t=(i.value||'').trim();
  if(!t){toast('보낼 말을 적어 주세요');return}
  if(blocked(t)){toast('인터넷 주소·전화번호·단체방 주소는 올릴 수 없어요');return}
  var m={id:'me'+Date.now(),mine:true,name:'나',age:P.age,side:P.vote,text:t,at:hhmm(),like:0};
  P.chat=(P.chat||[]).concat([{id:m.id,mine:true,name:'나',age:m.age,side:m.side,text:t,at:m.at,like:0}]);save();
  i.value='';S.draft='';pushMsg(m);
  // 참여하면 바로 반응이 와요 (시안용 연출)
  setTimeout(function(){m.like+=2;var el=document.getElementById('cm-'+m.id);if(el)el.outerHTML=chatMsg(m);toast('2명이 회원님 말에 공감했어요')},3000);
  var r=REPLIES[Math.floor(Math.random()*REPLIES.length)];
  setTimeout(function(){setTyping(r.name)},4200);
  setTimeout(function(){setTyping(null);pushMsg({id:'r'+Date.now(),name:r.name,age:r.age,side:r.side,text:'@회원님 '+r.t,at:hhmm(),like:0})},6200);
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='chat-in')S.draft=ev.target.value;if(ev.target.id==='reason'){P.reason=ev.target.value;var c=document.getElementById('rc');if(c)c.textContent=P.reason.length+' / 80';save()}});
render();
</script>

};
window.__site.apply(siteCfg());
