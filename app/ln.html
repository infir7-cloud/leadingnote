<!doctype html><html lang="ko"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}.stories,.stage-track,.hscroll,.table-wrap{position:relative}</style></head><body><script src="ln-data.js?v=202610200807"></script><title>리딩노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 휴대폰 한 손 앱 — 짙은 남색 바탕 위 한 단계 밝은 카드, 앰버 버튼(더리치 톤). 상단 고정 바, 하단 5탭. 비회원은 하단 가입 띠. */
:root{
  --bg:#0B0F14; --surface:#11171E; --raise:#161D25; --sunk:#1B232D; --ink:#EEF2F5; --ink2:#8D99A6; --line:#222B35;
  --accent:#C6F25E; --on-accent:#0B0F14; --accent-soft:#1D2714;
  --up:#B8EE5C; --on-up:#0B0F14; --up-soft:#1B2614;
  --down:#6E9BFF; --on-down:#06112B; --down-soft:#142039;
  --live:#FF5A5F; --on-live:#1A0506; --room:#090D12;
  --ad:#121820; --ad-line:#2E3945; --overlay:rgba(3,6,10,.76); --shadow:0 14px 34px rgba(0,0,0,.6);
  --kakao:#FEE500; --on-kakao:#191600;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono','IBM Plex Sans KR',ui-monospace,Menlo,monospace;
  --f-mark:var(--f-ui);
  --nav-h:4.5rem;
  color-scheme:dark;
}
/* 밝은 화면 (전체 > 화면 밝기) */
html.lite{
  --bg:#F3F5F7; --surface:#FFFFFF; --raise:#F8F9FA; --sunk:#E9EDF1; --ink:#0D1117; --ink2:#56616D; --line:#D9DFE5;
  --accent:#3F6F00; --on-accent:#FFFFFF; --accent-soft:#EAF4D8;
  --up:#3A7300; --on-up:#FFFFFF; --up-soft:#E6F2D5;
  --down:#1F4DB5; --on-down:#FFFFFF; --down-soft:#E4EBFA;
  --live:#D42A26; --on-live:#FFFFFF; --room:#E3E8ED;
  --ad:#EEF1F4; --ad-line:#A3ACB6; --overlay:rgba(10,14,20,.55); --shadow:0 10px 30px rgba(18,24,32,.16);
  color-scheme:light;
}

html{font-size:15px;height:100%}
html[data-size="l"]{font-size:17px}
html[data-size="xl"]{font-size:19px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:1.1875rem;line-height:1.55;-webkit-text-size-adjust:100%;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
*{box-sizing:border-box}
h1,h2,h3,p,ol,ul,dl{margin:0}
ul,ol{padding:0;list-style:none}
button,input,textarea{font-family:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.gx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 1.5rem)}
.app.has-join{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 7rem)}
.app.in-room{background:var(--room)}
@media (min-width:520px){ .app{box-shadow:0 0 0 1px var(--line)} }

/* 상단 바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{min-height:4rem;display:flex;align-items:center;gap:.5rem}
.wordmark{white-space:nowrap;font-family:var(--f-mark);font-weight:900;font-size:1.5rem;line-height:1;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:.45rem}
.wordmark i{width:1.35rem;height:1.35rem;border-radius:50%;background:conic-gradient(var(--accent) 0 40%,var(--up) 40% 70%,var(--down) 70% 100%);display:inline-block}
.sample{margin-left:auto;padding:.15rem .6rem;border-radius:999px;background:var(--sunk);color:var(--ink2);font-size:.875rem;font-weight:600;white-space:nowrap}
.top-title{font-size:1.3125rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-sub{font-size:.9375rem;color:var(--ink2);font-weight:600;white-space:nowrap}
.icon-btn{width:3.25rem;height:3.25rem;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:.875rem;cursor:pointer;margin-left:-.5rem}
.icon-btn svg{width:1.75rem;height:1.75rem}
.bell-btn{position:relative;margin-left:auto;margin-right:-.4rem;width:3.25rem;height:3.25rem;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:.875rem;cursor:pointer;color:var(--ink)}
.sample+.bell-btn,.app-btn+.bell-btn{margin-left:.25rem}
.app-btn{margin-left:auto;display:inline-flex;align-items:center;gap:.3rem;min-height:2.75rem;padding:0 .85rem;border-radius:999px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.app-btn svg{width:1.15rem;height:1.15rem}
html[data-size="l"] .app-btn .ab-t,html[data-size="xl"] .app-btn .ab-t{display:none}
html[data-size="l"] .app-btn,html[data-size="xl"] .app-btn{padding:0 .7rem}
html[data-size="xl"] .top-in{gap:.2rem}
html[data-size="xl"] .top-q{width:2.9rem;margin-left:0}
html[data-size="xl"] .wordmark{font-size:1.35rem}
html[data-size="xl"] .stage{flex-basis:calc(100% - 1.75rem)}
html[data-size="xl"] .st-hit b{font-size:1.5rem}
.dev-now{display:flex;align-items:center;gap:.5rem;font-size:1rem;color:var(--ink2);font-weight:600}
.dev-now b{color:var(--ink)}
.store{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:4rem;border-radius:1rem;background:var(--ink);color:var(--bg);font-size:1.25rem;font-weight:700;text-decoration:none}
.store svg{width:1.5rem;height:1.5rem}
.bell-btn svg{width:1.75rem;height:1.75rem}
.bdot{position:absolute;top:.35rem;right:.3rem;min-width:1.25rem;height:1.25rem;padding:0 .3rem;border-radius:999px;background:var(--live);color:var(--on-live);font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);line-height:1;font-variant-numeric:tabular-nums}

/* 하단 내비 */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.1rem;height:var(--nav-h);align-items:stretch;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-size:.875rem;font-weight:600;color:var(--ink2);cursor:pointer;border-radius:.875rem;margin:.35rem 0;white-space:nowrap;min-width:0}
.nav button svg{width:1.6rem;height:1.6rem}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav button[aria-current="page"] .nav-ic{background:var(--accent-soft)}
.nav-ic{position:relative;display:flex;align-items:center;justify-content:center;width:3rem;height:2rem;border-radius:999px}
.ndot{position:absolute;top:.05rem;right:.55rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--live);border:2px solid var(--surface)}

/* 비회원 가입 띠 */
.joinbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;z-index:29;padding-block:.6rem}
.joinbar-in{display:flex;align-items:center;gap:.6rem;padding:.75rem .9rem;border-radius:1rem;background:var(--raise);border:1.5px solid var(--accent);box-shadow:var(--shadow)}
.joinbar-in .jt{flex-grow:1;min-width:0;font-size:1rem;font-weight:600;line-height:1.4}
.joinbar-in .jt b{color:var(--accent)}
.jx{width:2.5rem;height:2.5rem;flex-shrink:0;border:0;background:transparent;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:.6rem}
.jx svg{width:1.25rem;height:1.25rem}

/* 공통 */
.screen{display:flex;flex-direction:column;gap:1.25rem;padding-top:1.25rem}
.h2{font-size:1.3125rem;font-weight:700;line-height:1.35;text-wrap:balance}
.sech{display:flex;align-items:center;gap:.5rem;font-size:1.25rem;font-weight:700;line-height:1.35}
.sech .cnt{color:var(--ink2);font-weight:600}
.sech .more{margin-left:auto}
.small{font-size:.9375rem;color:var(--ink2)}
.btn{min-height:3.5rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:0 1rem;border-radius:.875rem;border:0;font-size:1.125rem;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.25;text-align:center}
.btn svg{width:1.3rem;height:1.3rem;flex-shrink:0}
.btn-sm{min-height:3rem;font-size:1.0625rem;padding:0 .9rem}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-line{background:transparent;color:var(--ink);border:2px solid var(--ink2)}
.btn-accent-line{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn-quiet{background:var(--sunk);color:var(--ink)}
.btn-kakao{background:var(--kakao);color:var(--on-kakao)}
.btn-block{width:100%}
.link-btn{border:0;background:transparent;padding:.5rem .25rem;font-size:1rem;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:2.75rem}
.more-btn{border:0;background:transparent;display:inline-flex;align-items:center;gap:.1rem;font-size:1.0625rem;font-weight:700;color:var(--accent);cursor:pointer;min-height:2.75rem;padding:0 .25rem}
.more-btn svg{width:1.15rem;height:1.15rem}
.share-btn{display:inline-flex;align-items:center;gap:.3rem;min-height:2.75rem;padding:0 .8rem;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:1rem;font-weight:700;color:var(--ink2);cursor:pointer}
.share-btn svg{width:1.1rem;height:1.1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1.125rem}
.list{display:flex;flex-direction:column;gap:.75rem}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink2)}
.empty{padding:1.5rem 1rem;text-align:center;color:var(--ink2);font-size:1.0625rem;border:1.5px dashed var(--line);border-radius:1rem;display:flex;flex-direction:column;gap:.9rem;align-items:center}
.hl{box-shadow:0 0 0 3px var(--accent)!important;border-radius:1rem;animation:glow 1.6s ease 2}

.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
.chip{min-height:3rem;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:1.0625rem;font-weight:600;color:var(--ink2);cursor:pointer;padding:0 .75rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.hscroll{display:flex;gap:.5rem;overflow-x:auto;padding-block:.25rem;scrollbar-width:none;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex-shrink:0;scroll-snap-align:start}
.seg{display:grid;gap:.35rem;padding:.3rem;border-radius:1rem;background:var(--surface);border:1px solid var(--line)}
.seg button{min-height:3rem;border:0;border-radius:.75rem;background:transparent;font-size:1.0625rem;font-weight:600;color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.seg .count{padding:0 .5rem;border-radius:999px;background:var(--bg);color:var(--ink);font-size:.9375rem}
.seg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg2{grid-template-columns:repeat(2,minmax(0,1fr))}
.live-pill{display:inline-flex;align-items:center;gap:.3rem;padding:.05rem .55rem;border-radius:.4rem;background:var(--live);color:var(--on-live);font-size:.875rem;font-weight:700;line-height:1.5;white-space:nowrap}
.live-pill::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:currentColor;animation:blink 1.4s ease-in-out infinite}

.avatar{width:3.5rem;height:3.5rem;flex-shrink:0;border-radius:50%;background:var(--sunk);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-mark);font-weight:900;font-size:1.4rem;position:relative}
.avatar.is-live{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--live)}
.avatar .fav{position:absolute;right:-.2rem;bottom:-.2rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.avatar .fav svg{width:.85rem;height:.85rem}
.avatar.lg{width:4.25rem;height:4.25rem;font-size:1.7rem}
.avatar.sm{width:2.75rem;height:2.75rem;font-size:1.1rem}

/* 홈 */
.intro{display:flex;flex-direction:column;gap:.85rem;padding-block:1.5rem 1.4rem;border-bottom:1px solid var(--line)}
.eyebrow{font-size:1rem;font-weight:700;color:var(--accent)}
.intro h1{font-size:2rem;line-height:1.25;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.intro p.lead{font-size:1.125rem;line-height:1.6;color:var(--ink2)}
.checklist{display:flex;flex-direction:column;gap:.7rem;padding:1.1rem 1rem;border-radius:1.125rem;background:var(--surface);border:1.5px solid var(--accent)}
.ck-top{display:flex;align-items:center;gap:.5rem}
.ck-top b{font-size:1.1875rem;flex-grow:1}
.ck-top .small{font-variant-numeric:tabular-nums}
.ckbar{height:.6rem;border-radius:999px;background:var(--sunk);overflow:hidden}
.ckbar span{display:block;height:100%;background:var(--accent)}
.ck{display:flex;align-items:center;gap:.75rem;width:100%;min-height:3.75rem;padding:.4rem 0;border:0;background:transparent;text-align:left;cursor:pointer;font-size:1.125rem;font-weight:600}
.ck+.ck{border-top:1px solid var(--line)}
.ck .cb{width:1.9rem;height:1.9rem;flex-shrink:0;border-radius:50%;border:2.5px solid var(--ink2);display:flex;align-items:center;justify-content:center}
.ck.on .cb{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ck.on .ct{color:var(--ink2);text-decoration:line-through}
.ck .ct{flex-grow:1}
.ck>svg{width:1.2rem;height:1.2rem;color:var(--ink2)}
.hero{padding-block:1.25rem .5rem;display:flex;flex-direction:column;gap:.85rem}
.stage-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:max(16px,env(safe-area-inset-left,0px));scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:.15rem}
.stage-track::-webkit-scrollbar{display:none}
.stage{flex:0 0 calc(100% - 2.75rem);max-width:26rem;scroll-snap-align:start;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:.85rem;padding:1.05rem 1.1rem 0;border-radius:1.25rem;border:1px solid var(--line);
  background:radial-gradient(85% 75% at 100% 0%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%),var(--surface);text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.stage.on-air{border-color:color-mix(in srgb,var(--live) 55%,var(--line));background:radial-gradient(85% 75% at 100% 0%,color-mix(in srgb,var(--live) 24%,transparent),transparent 70%),var(--surface)}
.stage.solo{flex-basis:100%;max-width:none}
.stage:active{transform:scale(.985)}
.st-top{display:flex;align-items:center;gap:.4rem .5rem;min-width:0;flex-wrap:wrap}
.st-time{margin-left:auto;font-size:.9375rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.st-bug{flex-shrink:0;padding:.05rem .5rem;border:1.5px solid var(--ink2);border-radius:.35rem;font-size:.875rem;font-weight:800;color:var(--ink);white-space:nowrap}
.st-tag{flex-shrink:0;padding:.05rem .55rem;border-radius:.4rem;background:var(--accent-soft);color:var(--accent);font-size:.875rem;font-weight:700;line-height:1.5}
.st-title{position:relative;font-family:var(--f-mark);font-weight:900;font-size:1.75rem;line-height:1.28;letter-spacing:-.02em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st-who{position:relative;display:flex;align-items:center;gap:.7rem}
.st-hit{margin-left:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.st-hit b{font-family:var(--f-mark);font-weight:900;font-size:1.75rem;color:var(--accent);font-variant-numeric:tabular-nums}
.st-hit span{font-size:.875rem;color:var(--ink2);font-weight:600}
.st-name{min-width:0;display:flex;flex-direction:column}
.st-name b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.st-name{flex:1 1 auto}
.st-name b{font-size:1.1875rem;line-height:1.3}
.st-name span{font-size:.9375rem;color:var(--ink2)}
.st-lower{position:relative;margin:auto -1.1rem 0;display:flex;align-items:stretch;min-height:3.4rem;background:var(--bg);border-top:1px solid var(--line)}
.st-lt{flex-shrink:0;display:flex;align-items:center;padding:0 .75rem;line-height:1.25;text-align:center;background:var(--accent);color:var(--on-accent);font-size:.9375rem;font-weight:800;white-space:nowrap}
.st-lx{flex-grow:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:.5rem .8rem}
.st-lower>svg{width:1.3rem;height:1.3rem;flex-shrink:0;align-self:center;margin-right:.7rem;color:var(--ink2)}
.st-lx b{font-size:1.0625rem;line-height:1.35;font-variant-numeric:tabular-nums;word-break:keep-all}
.st-lx>span{font-size:.875rem;color:var(--ink2)}
.stage-dots{display:flex;justify-content:center;gap:.4rem;margin-top:-.25rem}
.stage-dots span{width:.5rem;height:.5rem;border-radius:999px;background:var(--line);transition:width .2s,background .2s}
.stage-dots span.on{width:1.4rem;background:var(--accent)}
.stories{display:flex;gap:.85rem;overflow-x:auto;scrollbar-width:none;padding:.5rem max(16px,env(safe-area-inset-left,0px)) .25rem}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 4.6rem;display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:0;border:0;background:transparent;cursor:pointer;color:var(--ink);font:inherit}
.story .av{position:relative;width:4rem;height:4rem;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-family:var(--f-mark);font-weight:900;font-size:1.5rem;box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--line)}
.story.live .av{box-shadow:0 0 0 2.5px var(--bg),0 0 0 5px var(--live)}
.story.fav .av{box-shadow:0 0 0 2.5px var(--bg),0 0 0 5px var(--accent)}
.story .on{position:absolute;left:50%;bottom:-.55rem;transform:translateX(-50%);padding:0 .4rem;border-radius:.35rem;background:var(--live);color:var(--on-live);font-family:var(--f-body,inherit);font-size:.75rem;font-weight:800;line-height:1.55;border:2px solid var(--bg);white-space:nowrap}
.story .star{position:absolute;top:-.25rem;right:-.3rem;width:1.45rem;height:1.45rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.story .star svg{width:.8rem;height:.8rem}
.story b{font-size:.9375rem;font-weight:600;line-height:1.3;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.story.all .av{background:transparent;box-shadow:none;border:1.5px dashed var(--ink2);color:var(--accent)}

.xl-card{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;min-height:3.75rem;padding:.45rem 1rem .45rem .45rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--live) 45%,var(--line));background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.xl-card .avatar{width:2.75rem;height:2.75rem;font-size:1.1rem}
.xl-card b{display:block;font-size:1rem;line-height:1.25;white-space:nowrap}
.xl-card .s{display:block;font-size:.8125rem;font-weight:600;color:var(--live);white-space:nowrap}
.xrank{display:flex;flex-direction:column;gap:.6rem}
.xr-head{display:flex;align-items:center;justify-content:space-between}
.xr-head .link-btn{min-height:2.5rem}
.xr{display:flex;align-items:center;gap:.4rem;padding:.7rem .8rem .7rem .5rem}
.xr+.xr{border-top:1px solid var(--line)}
.xr-main{flex:1;min-width:0;display:flex;align-items:center;gap:.6rem;min-height:4.5rem;padding:0;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.xr-rk{width:1.6rem;flex-shrink:0;text-align:center;font-family:var(--f-mono);font-size:1rem;font-weight:600;color:var(--ink2)}
.xr-rk.top{color:var(--accent)}
.xr-main .avatar{width:3rem;height:3rem;font-size:1.15rem}
.xr-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:.2rem}
.xr-t b{font-size:1.125rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr-s{font-size:.8125rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr-live{display:inline-flex;align-items:center;gap:.3rem;font-size:.8125rem;font-weight:600;color:var(--live);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr-live::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:currentColor;flex-shrink:0;animation:blink 1.4s ease-in-out infinite}
.xr-bar{display:block;height:.3rem;margin-top:.2rem;border-radius:999px;background:var(--line);overflow:hidden}
.xr-bar i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.xr-hit{flex-shrink:0;min-width:3.75rem;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.xr-hit b{font-family:var(--f-mono);font-size:1.375rem;font-weight:600;letter-spacing:-.02em}
.xr-hit span{font-size:.75rem;color:var(--ink2)}
.xr-hit .up,.xr-hit .down,.xr-hit .flat{font-family:var(--f-mono);font-size:.875rem;font-weight:600}
.xr-hit .up{color:var(--up)} .xr-hit .down{color:var(--down)}
.xr .star-btn{width:2.75rem;height:2.75rem}
.xd{display:flex;flex-direction:column;gap:1rem;padding-block:1.1rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--line)}
.xd-top{display:flex;align-items:center;gap:.9rem}
.xd-id{min-width:0;display:flex;flex-direction:column;gap:.3rem}
.xd-id h2{font-size:1.5rem;font-weight:700;line-height:1.25;letter-spacing:-.03em}
.xd-tags{display:flex;flex-wrap:wrap;gap:.3rem}
.xd-fans{font-size:.875rem;color:var(--ink2)} .xd-fans b{color:var(--ink)}
.xd-intro{font-size:1.0625rem;line-height:1.55}
.xd-live{display:flex;align-items:center;gap:.7rem;width:100%;padding:.8rem .9rem;border-radius:.75rem;border:1px solid color-mix(in srgb,var(--live) 45%,var(--line));background:color-mix(in srgb,var(--live) 8%,var(--surface));color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.xd-live .ld{width:.65rem;height:.65rem;flex-shrink:0;border-radius:50%;background:var(--live);animation:blink 1.4s ease-in-out infinite}
.xd-live .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.xd-live .lt b{font-size:1.0625rem;color:var(--live)} .xd-live .lt span{font-size:.875rem;color:var(--ink2)}
.xd-live>svg{width:1.2rem;height:1.2rem;flex-shrink:0;color:var(--ink2)}
.xd-stats{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center;padding:1rem;border-radius:.75rem;background:var(--bg);border:1px solid var(--line)}
.xd-ring .c b{color:var(--accent)}
.xd-kv{display:flex;flex-direction:column;min-width:0}
.xd-kv div{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;padding:.4rem 0;border-bottom:1px dashed var(--line)}
.xd-kv div:last-child{border-bottom:0}
.xd-kv span{font-size:.875rem;color:var(--ink2);white-space:nowrap}
.xd-kv b{font-family:var(--f-mono);font-size:1rem;font-weight:600;white-space:nowrap;word-spacing:-.3em}
.xd-kv b.up{color:var(--up)} .xd-kv b.down{color:var(--down)}
.xd-ch{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem}
.xd-ch .cl{font-size:.875rem;font-weight:600;color:var(--ink2);margin-right:.15rem}
.xd-ch .chbtn{min-height:2.5rem}
.xd .basis{margin-top:-.4rem}
.pform{padding:1rem;display:flex;flex-direction:column;gap:.65rem}
.pstep{display:flex;align-items:center;gap:.55rem;margin-top:.75rem;padding-top:.85rem;border-top:1px solid var(--line);font-size:1.0625rem;font-weight:700}
.pstep:first-child{margin-top:0;padding-top:0;border-top:0}
.pstep i{width:1.6rem;height:1.6rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);color:var(--on-accent);font-style:normal;font-family:var(--f-mono);font-size:.8125rem;font-weight:700}
.pstat{display:flex;flex-direction:column;gap:.55rem;padding:.8rem .9rem;border-radius:.6rem;background:var(--raise);border:1px solid var(--line)}
.ps-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.ps-badge{padding:.1rem .6rem;border-radius:999px;background:var(--sunk);color:var(--ink2);font-size:.8125rem;font-weight:700}
.ps-holding{background:var(--accent-soft);color:var(--accent)} .ps-watch{background:var(--down-soft);color:var(--down)}
.ps-px{margin-left:auto;display:flex;align-items:baseline;gap:.4rem;font-family:var(--f-mono);font-size:.9375rem;word-spacing:-.3em}
.ps-msg{font-size:.9375rem;line-height:1.5;color:var(--ink2)}
.ps-msg .up{color:var(--up)} .ps-msg .down{color:var(--down)}
.ps-kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35rem}
.ps-kv div{display:flex;flex-direction:column;gap:.05rem;min-width:0;padding:.45rem .55rem;border-radius:.45rem;background:var(--surface);border:1px solid var(--line)}
.ps-kv span{font-size:.75rem;color:var(--ink2);white-space:nowrap}
.ps-kv b{font-family:var(--f-mono);font-size:.9375rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind-grid .chip[disabled]{opacity:.35;cursor:not-allowed}
.khint{font-size:.875rem;line-height:1.55;color:var(--ink2)}
.pfield{position:relative;display:flex;align-items:center}
.pfield .field{width:100%;padding-right:2.6rem;text-align:right;font-family:var(--f-mono);font-size:1.25rem}
.pfield .u{position:absolute;right:.9rem;font-size:1rem;color:var(--ink2);pointer-events:none}
.pquick{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:-.15rem}
.pquick button{min-height:2.375rem;padding:0 .75rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-mono);font-size:.875rem;font-weight:600;word-spacing:-.3em;cursor:pointer}
.pquick button:active{background:var(--accent-soft);border-color:var(--accent)}
.pcalc{display:flex;flex-wrap:wrap;gap:.35rem}
.pcalc:empty{display:none}
.pcalc span{padding:.3rem .6rem;border-radius:.4rem;background:var(--raise);border:1px solid var(--line);font-family:var(--f-mono);font-size:.875rem;word-spacing:-.3em}
.pcalc .warn{border-color:var(--live);color:var(--live)}
.psrc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.35rem}
.psrc .chip{padding:0 .3rem}
.pv-card{padding:.85rem;border-radius:.9rem;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow)}
.pv-n{display:flex;align-items:flex-start;gap:.65rem}
.pv-logo{width:2.1rem;height:2.1rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:.55rem;background:var(--accent);color:var(--on-accent)}
.pv-logo svg{width:1.2rem;height:1.2rem}
.pv-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:.15rem}
.pv-h{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink2)}
.pv-h b{font-weight:600}
.pv-t>b{font-size:.9375rem}
.pv-t p{font-size:.9375rem;line-height:1.5}
.pv-meta{display:flex;flex-direction:column;gap:.2rem;margin-top:.6rem;font-size:.875rem;color:var(--ink2)}
.pv-meta li::before{content:"· "}
.pv-meta b{color:var(--ink)}
.pv-empty{padding:.8rem;border-radius:.6rem;border:1px dashed var(--line);font-size:.9375rem;line-height:1.5;color:var(--ink2)}
.pconf{display:flex;flex-direction:column;gap:.6rem;padding:1rem;border-radius:.75rem;border:1.5px solid var(--accent);background:var(--accent-soft)}
.pconf>b{font-size:1.125rem}
.pconf>p{font-size:1rem;line-height:1.55}
.fab-wrap{position:fixed;z-index:31;right:max(16px,calc(50vw - 240px + 16px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 1rem);animation:fabin .35s cubic-bezier(.2,.8,.2,1);transition:opacity .35s ease,transform .35s ease}
.fab-wrap.over-join{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 7rem)}
.fab-wrap.out{opacity:0;transform:translateY(12px) scale(.96);pointer-events:none}
.app-btn.fab{margin:0;min-height:3.5rem;padding:0 1.3rem 0 1.1rem;gap:.45rem;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-family:'Pretendard Variable',Pretendard,var(--f-ui);font-size:1.0625rem;font-weight:800;word-spacing:normal;box-shadow:0 14px 30px -12px rgba(0,0,0,.7),0 0 0 5px color-mix(in srgb,var(--accent) 16%,transparent)}
.app-btn.fab svg{width:1.35rem;height:1.35rem}
html[data-size] .app-btn.fab .ab-t{display:inline}
@keyframes fabin{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.is-home .tm,.is-home .prow,.card,.stage{-webkit-touch-callout:none}

/* ===== 홈 리뉴얼 — 차분한 아침 브리핑 톤: 한글 가독성 서체, 부드러운 카드, 큰 터치 영역 (홈 화면에만 적용) ===== */
.app.is-home{
  --f-home:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --h-line:color-mix(in srgb,var(--line) 80%,transparent);
  --h-glow:color-mix(in srgb,var(--accent) 10%,transparent);
  --h-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 18px 40px -28px rgba(0,0,0,.9);
  background:radial-gradient(130% 34rem at 90% -10rem,var(--h-glow),transparent 62%),var(--bg)}
html.lite .app.is-home{--h-glow:color-mix(in srgb,var(--accent) 7%,transparent);--h-shadow:0 1px 2px rgba(15,23,42,.04),0 16px 36px -26px rgba(15,23,42,.32)}
.is-home>.top,.is-home>main{--f-ui:var(--f-home);--f-mono:var(--f-home);--f-mark:var(--f-home);font-family:var(--f-home);letter-spacing:-.012em}
.is-home>.top *,.is-home>main *{word-spacing:normal;text-transform:none}
.is-home :is(.hsearch,.hq,.hl-card,.prow,.tm,.stage,.hs-more,.story){transition:transform .12s ease,border-color .15s ease}
.is-home :is(.hsearch,.hq,.hl-card,.prow,.tm,.hs-more):active{transform:scale(.985)}

/* 상단 */
.is-home>.top{background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px)}
.hm{display:flex;align-items:center;gap:.7rem;min-width:0;margin-right:auto}
.hm-logo{width:2.6rem;height:2.6rem;flex-shrink:0;border-radius:.85rem;display:flex;align-items:center;justify-content:center;color:var(--on-accent);background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--bg)));box-shadow:0 8px 18px -10px var(--accent)}
.hm-logo svg{width:1.45rem;height:1.45rem}
.hm-t{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.hm-t b{font-size:1.375rem;font-weight:800;letter-spacing:-.04em}
.hm-t small{margin-top:.2rem;font-size:.875rem;font-weight:500;color:var(--ink2);white-space:nowrap}
.is-home .app-btn{margin-left:0;border-radius:999px;font-family:var(--f-home);font-size:.9375rem;font-weight:700}
html[data-size="xl"] .hm-t small{display:none}
html[data-size="xl"] .hm-logo{width:2.2rem;height:2.2rem}

/* 구성 */
.is-home>main{display:flex;flex-direction:column;gap:2.5rem;padding:.5rem 0 1.25rem}
.hlead{display:flex;flex-direction:column;gap:1rem}
.hsec{display:flex;flex-direction:column;gap:1rem}
.hgreet{display:flex;flex-direction:column;gap:.45rem;padding-top:.75rem}
.hg-k{display:inline-flex;align-items:center;gap:.55rem;font-size:1rem;font-weight:700;color:var(--accent)}
.hg-k::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px var(--h-glow)}
.hg-h{font-size:1.75rem;font-weight:800;line-height:1.32;letter-spacing:-.045em;text-wrap:balance}

/* 첫 방문 환영 카드 */
.hw-card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:1.15rem;padding:1.5rem 1.25rem 1.25rem;border-radius:1.5rem;border:1px solid color-mix(in srgb,var(--accent) 24%,var(--line));
  background:radial-gradient(90% 70% at 100% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),linear-gradient(180deg,var(--raise),var(--surface));box-shadow:var(--h-shadow)}
.hw-card::after{content:"";position:absolute;right:-4.5rem;top:-4.5rem;width:12rem;height:12rem;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);box-shadow:0 0 0 1.6rem color-mix(in srgb,var(--accent) 4%,transparent),0 0 0 3.2rem color-mix(in srgb,var(--accent) 3%,transparent);pointer-events:none}
.hw-card>*{position:relative;z-index:1}
.hw-badge{align-self:flex-start;display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .75rem;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.9375rem;font-weight:700}
.hw-badge svg{width:1.05rem;height:1.05rem}
.hw-h{font-size:2.125rem;font-weight:800;line-height:1.26;letter-spacing:-.05em;text-wrap:balance}
.hw-h em{font-style:normal;color:var(--accent)}
.hw-p{font-size:1.125rem;line-height:1.65;color:var(--ink2);word-break:keep-all}
.hw-list{display:flex;flex-direction:column;gap:.7rem;padding:1rem;border-radius:1.1rem;background:color-mix(in srgb,var(--bg) 50%,transparent);border:1px solid var(--h-line)}
.hw-list li{display:flex;align-items:center;gap:.7rem;font-size:1.0625rem;font-weight:600;line-height:1.45}
.hw-ic{width:1.75rem;height:1.75rem;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent)}
.hw-ic svg{width:1rem;height:1rem}
.hw-card .btn-kakao{min-height:3.875rem;border-radius:1rem;font-size:1.1875rem;font-weight:800;box-shadow:0 12px 26px -16px var(--kakao)}
.hw-card .link-btn{align-self:center;margin-top:-.45rem;font-size:1rem}

/* 검색 · 바로가기 */
.hsearch{display:flex;align-items:center;gap:.85rem;width:100%;min-height:4.75rem;padding:.75rem .75rem .75rem 1.1rem;border-radius:1.25rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;font:inherit;cursor:pointer;box-shadow:var(--h-shadow)}
.hsearch>svg{width:1.65rem;height:1.65rem;flex-shrink:0;color:var(--accent)}
.hs-x{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem}
.hs-x b{font-size:1.1875rem;font-weight:700}
.hs-x span{font-size:.9375rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs-go{flex-shrink:0;display:flex;align-items:center;min-height:3.1rem;padding:0 1.15rem;border-radius:.9rem;background:var(--ink);color:var(--bg);font-size:1.0625rem;font-weight:700}
.hquick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}
.hq{display:flex;flex-direction:column;align-items:flex-start;gap:.2rem;min-width:0;min-height:8rem;padding:1rem;border-radius:1.25rem;border:1px solid var(--h-line);background:var(--surface);color:var(--ink);text-align:left;font:inherit;cursor:pointer;box-shadow:var(--h-shadow)}
.hq-ic{width:2.85rem;height:2.85rem;margin-bottom:auto;border-radius:.95rem;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.hq-ic svg{width:1.5rem;height:1.5rem}
.hq.t2 .hq-ic{background:var(--down-soft);color:var(--down)}
.hq.t3 .hq-ic{background:color-mix(in srgb,var(--live) 14%,transparent);color:var(--live)}
.hq.t4 .hq-ic{background:color-mix(in srgb,var(--kakao) 16%,transparent);color:color-mix(in srgb,var(--kakao) 70%,var(--ink))}
.hq b{margin-top:.85rem;font-size:1.125rem;font-weight:700;line-height:1.3}
.hq-s{font-size:.9375rem;color:var(--ink2);line-height:1.35}

/* 섹션 머리 */
.hs-head{display:flex;align-items:flex-end;gap:.75rem}
.hs-head>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem}
.hs-t,.is-home .sech{font-size:1.4375rem;font-weight:800;line-height:1.3;letter-spacing:-.045em}
.hs-s{font-size:.9375rem;color:var(--ink2);line-height:1.5}
.hs-more,.is-home .more-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:.15rem;min-height:2.75rem;padding:0 .45rem 0 .9rem;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.9375rem;font-weight:600;letter-spacing:-.01em;cursor:pointer}
.hs-more svg,.is-home .more-btn svg{width:1.1rem;height:1.1rem;color:var(--ink2)}
.is-home .sech .cnt{padding:.05rem .55rem;border-radius:999px;background:color-mix(in srgb,var(--live) 16%,transparent);color:var(--live);font-size:.9375rem;font-weight:700;letter-spacing:0}
.hcard{border-radius:1.25rem;border:1px solid var(--h-line);background:var(--surface);box-shadow:var(--h-shadow);overflow:hidden}

/* 전문가 무대 카드 */
.is-home .hero{padding:0;gap:1rem}
.is-home .stage{gap:.95rem;padding:1.25rem 1.25rem 0;border-radius:1.5rem;border:1px solid var(--h-line);box-shadow:var(--h-shadow);
  background:radial-gradient(90% 80% at 100% 0%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 65%),linear-gradient(180deg,var(--raise),var(--surface))}
.is-home .stage.on-air{border-color:color-mix(in srgb,var(--live) 38%,var(--line));background:radial-gradient(90% 80% at 100% 0%,color-mix(in srgb,var(--live) 16%,transparent),transparent 65%),linear-gradient(180deg,var(--raise),var(--surface))}
.is-home .live-pill{padding:.2rem .65rem;border-radius:999px;background:color-mix(in srgb,var(--live) 16%,transparent);font-size:.875rem;font-weight:700}
.is-home .st-tag{padding:.2rem .65rem;border-radius:999px;background:var(--accent-soft);font-size:.875rem;font-weight:700}
.is-home .st-bug{font-size:.9375rem;font-weight:600;color:var(--ink2)}
.is-home .st-bug::before{content:none}
.is-home .st-time{font-size:.875rem}
.is-home .st-title{font-size:1.5rem;font-weight:800;line-height:1.36;letter-spacing:-.045em}
.is-home .avatar,.is-home .story .av{border:0;border-radius:50%;background:linear-gradient(160deg,var(--raise),var(--sunk));font-weight:800}
.is-home .st-name b{font-size:1.125rem;font-weight:700}
.is-home .st-name span{font-size:.875rem}
.is-home .st-hit{align-items:center;padding:.45rem .8rem;border-radius:1rem;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--h-line)}
.is-home .st-hit b{font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
.is-home .st-hit span{font-size:.8125rem;font-weight:600}

function postEvent(e,s,ev,dry){
  var ps=pairState(e,s),lid;
  if(ev.t==='buy'){
    if(ps.st==='holding')return '이미 가지고 있는 종목이에요. 값을 바꾸려면 "가격 변경"을 쓰세요';
    if(!(ev.stop<ev.buy&&ev.buy<ev.target))return '목표 가격은 구매 가격보다 높고, 손해 막는 가격은 구매 가격보다 낮아야 해요';
    lid=ps.st==='watch'?ps.L.id:newLid(e,s);
  }else if(ev.t==='sell'||ev.t==='revise'){
    if(ps.st!=='holding')return '지금 가지고 있는 종목이 아니에요. 먼저 "구매"를 올려 주세요';
    if(ev.t==='revise'){var nx={buy:ps.a.cur.buy,target:ps.a.cur.target,stop:ps.a.cur.stop};var f=Object.keys(ev).filter(function(k){return k in nx})[0];
      if(nx[f]===ev[f])return '지금 값과 같아요. 바뀐 가격을 적어 주세요';
      nx[f]=ev[f];if(!(nx.stop<nx.buy&&nx.buy<nx.target))return '바꾼 뒤에도 손해 막는 가격 < 구매 가격 < 목표 가격이어야 해요';}
    lid=ps.L.id;
  }else if(ev.t==='watch'){
    if(ps.st==='holding')return '가지고 있는 종목은 "조언"이나 "판매"를 쓰세요';
    lid=ps.st==='watch'?ps.L.id:newLid(e,s);
  }else{
    if(ps.st==='none')return '이 종목은 아직 추천 기록이 없어요. 먼저 "구매"나 "지켜보기"를 올려 주세요';
    lid=ps.L.id;
  }
  if(dry)return null;

function qnorm(v){return String(v||'').toLowerCase().replace(/\s+/g,'')}
function searchQuotes(q,limit){
  q=qnorm(q);if(!q)return [];
  var digit=/^\d+$/.test(q),exact=[],head=[],part=[];
  PX.rows.forEach(function(r){
    if(digit){if(r.c.indexOf(q)===0)(r.c===q?exact:head).push(r);return}
    var n=qnorm(r.n);if(n===q)exact.push(r);else if(n.indexOf(q)===0)head.push(r);else if(n.indexOf(q)>-1)part.push(r);
  });
  return exact.concat(head,part).slice(0,limit||30);
}
function quoteRank(kind,n){

function onAirText(since){
  var p=parseAt(since),h=p.h%12||12,t=(p.h<12?'오전 ':'오후 ')+h+'시'+(p.mi?' '+p.mi+'분':'')+'부터';
  if(since.slice(0,10)!==today())return t;
  var m=Math.floor((new Date()-new Date(p.y,p.m-1,p.d,p.h,p.mi))/60000);
  return m>=1&&m<180?(m>=60?Math.floor(m/60)+'시간'+(m%60?' '+m%60+'분':''):m+'분')+'째 방송 중':t;
}
function latestCall(id){
  var ev=expertEvents(id);
  for(var i=ev.length-1;i>=0;i--){var s=ev[i],e=s.e,n=STOCKS[s.L.stock].name;
    if(e.t==='buy')return {s:s,html:esc(n)+' 구매 '+won(e.buy)};
    if(e.t==='sell')return {s:s,html:esc(n)+' 판매 '+won(e.sell)+' <span class="'+tone(s.ret)+'">'+pct(s.ret)+'</span>'};
    if(e.t==='revise'){var c=s.changed[0];return {s:s,html:esc(n)+' '+FIELD_LABEL[c.k]+' '+won(c.to)+'로 변경'};}
    if(e.t==='watch')return {s:s,html:esc(n)+' 지켜보기'};}
  return null;
}
function stageCard(x,solo){
  var st=expertStats(x.id),c=latestCall(x.id),f=isFollow(x.id),live=!!x.live;
  var top=live?'<span class="live-pill">방송 중</span><span class="st-bug">'+esc(x.live.ch)+'</span><span class="st-time">'+onAirText(x.live.since)+'</span>'
              :'<span class="st-tag">'+(f?'관심 전문가':'전문가')+'</span><span class="st-bug">'+esc(x.channels[0]||'')+'</span>';
  var title=live?esc(x.live.title):esc(x.intro);
  return '<button class="stage'+(live?' on-air':'')+(solo?' solo':'')+'" data-a="expert" data-v="'+x.id+'" aria-label="'+esc(x.name)+(live?', '+esc(x.live.ch)+' 방송 중':'')+', 자세히 보기">'+
    '<span class="st-top">'+top+'</span>'+
    '<span class="st-title">'+title+'</span>'+
    '<span class="st-who">'+avatar(x)+'<span class="st-name"><b>'+esc(x.name)+'</b><span>팔로워 '+fansOf(x).toLocaleString('ko-KR')+'명</span></span>'+
      '<span class="st-hit"><b>'+(st.hitRate==null?'-':Math.round(st.hitRate)+'%')+'</b><span>적중률</span></span></span>'+
    (c?'<span class="st-lower"><span class="st-lt">최근<br>추천</span><span class="st-lx"><b>'+c.html+'</b><span>'+fmtWhen(c.s.e.at)+'</span></span>'+IC.right+'</span>':'')+
  '</button>';
}
function heroHTML(){
  var ord=heroOrder(P.follows),lives=ord.filter(function(o){return o.x.live}).map(function(o){return o.x});
  var feat=lives.length?lives:ord.filter(function(o){return isFollow(o.x.id)}).slice(0,3).map(function(o){return o.x});
  if(!feat.length)feat=ord.slice(0,1).map(function(o){return o.x});
  var head=lives.length?'지금 방송 중 <span class="cnt">'+lives.length+'</span>':P.follows.length?'내 관심 전문가':'추천 전문가';

    var x=o.x,live=!!x.live,f=isFollow(x.id);

  return h+'</section>';

function allMsgs(stockFilter){
  var seed=SEED_MSGS.map(function(m,i){return {id:'m'+i,s:m.s,who:m.n,at:m.at,text:m.t,l:m.l,mine:false}});
  var mine=[];Object.keys(P.msgs).forEach(function(s){(P.msgs[s]||[]).forEach(function(m){mine.push({id:m.id,s:s,who:m.who,at:m.at,text:m.text,l:0,mine:true,role:m.role})})});
  var all=seed.concat(mine);
  if(stockFilter)all=all.filter(function(m){return m.s===stockFilter});
  return all;
}

      kakaoBtn('카카오로 3초 만에 알림 받기')+'<button class="btn btn-line btn-block" data-a="join">네이버 아이디로 로그인·가입</button></section>';
  }else{
    h+='<button class="btn '+(f?'btn-accent-line':'btn-primary')+' btn-block" data-a="follow" data-v="'+x.id+'">'+(f?IC.starOn+x.name+' 알림 받는 중':IC.bell+x.name+' 새 추천 알림 받기')+'</button>';
  }
  h+='<section class="group"><h2 class="sech">다른 투자자들의 생각</h2>'+pollHTML(a.L.stock)+'</section>';

  return h+'</main>';
}

function readPost(){
  var e=valOf('p-exp')||myExpert()||S.pe,s=valOf('p-stock'),k=S.pk||'buy',ev={t:k},url=valOf('p-url');
  if(!expertOf(e))return {err:'전문가를 골라 주세요'};
  if(!STOCKS[s])return {err:'종목을 골라 주세요'};
  if(k==='buy'){ev.buy=numOf('p-buy');ev.target=numOf('p-target');ev.stop=numOf('p-stop');
    if(!(ev.buy>0&&ev.target>0&&ev.stop>0))return {err:'구매 가격·목표 가격·손해 막는 가격을 모두 적어 주세요'};
    if(!(ev.stop<ev.buy&&ev.buy<ev.target))return {err:'목표 가격은 구매 가격보다 높고, 손해 막는 가격은 구매 가격보다 낮아야 해요'};}
  else if(k==='sell'){ev.sell=numOf('p-sell');if(!(ev.sell>0))return {err:'판매 가격을 적어 주세요'};}
  else if(k==='revise'){var f=valOf('p-field')||'buy',v=numOf('p-val');if(!(v>0))return {err:'새 가격을 적어 주세요'};ev[f]=v;}
  else if(k==='news'){ev.title=valOf('p-title');ev.press=valOf('p-press')||'기사';if(ev.title.length<4)return {err:'기사 제목을 4자 이상 적어 주세요'};}
  else{ev.text=valOf('p-text');if(ev.text.length<4)return {err:'내용을 4자 이상 적어 주세요'};
    if(isBlocked(ev.text))return {err:'인터넷 주소·전화번호·단체방 주소는 넣을 수 없어요. 원문 주소 칸을 써 주세요'};}
  if(k!=='news')ev.src=S.psrc||'방송';
  if(url){if(!/^https?:\/\/\S+$/i.test(url))return {err:'원문 주소는 http:// 또는 https:// 로 시작해야 해요'};ev.url=url;}
  return {e:e,s:s,ev:ev};
}
function previewText(r){
  var e=r.ev,n=STOCKS[r.s].name,ps=pairState(r.e,r.s);
  if(e.t==='buy')return n+' '+won(e.buy)+'에 구매 추천이에요. 목표 가격은 '+won(e.target)+', '+won(e.stop)+' 아래로 내려가면 판매하세요.';
  if(e.t==='sell'){if(ps.st!=='holding')return null;var ret=(e.sell-ps.a.cur.buy)/ps.a.cur.buy*100;
    return n+' '+won(e.sell)+'에 판매 추천이에요. 구매 가격 '+won(ps.a.cur.buy)+' 대비 '+pct(ret)+'예요. (성적표에 '+(ret>0?'적중':'실패')+'으로 들어가요)';}
  if(e.t==='revise'){if(ps.st!=='holding')return null;var f=['buy','target','stop'].filter(function(k){return e[k]!=null})[0];
    return n+' '+FIELD_LABEL[f]+'을 '+won(ps.a.cur[f])+'에서 '+won(e[f])+'으로 바꿨어요.';}
  if(e.t==='watch')return josa(n,'은','는')+' 아직 구매하지 말고 지켜보세요. '+e.text;
  if(e.t==='news')return n+' 관련 뉴스예요. '+e.title;
  return n+': '+e.text;
}
function postCalcHTML(){
  var k=S.pk||'buy',e=valOf('p-exp')||myExpert()||S.pe,s=valOf('p-stock')||S.ps;if(!STOCKS[s])return '';
  var ps=pairState(e,s),cur=STOCKS[s].price,out=[];
  if(k==='buy'){var b=numOf('p-buy'),t=numOf('p-target'),l=numOf('p-stop');
    if(b>0){
      if(t>0)out.push(['목표까지 '+pct((t-b)/b*100),t<=b]);
      if(l>0)out.push(['손해 막는 선 '+pct((l-b)/b*100),l>=b]);
      if(t>b&&l>0&&l<b)out.push(['손익비 1 : '+((t-b)/(b-l)).toFixed(1),false]);
      var gap=(b-cur)/cur*100;if(Math.abs(gap)>=15)out.push(['지금 가격과 '+pct(gap)+' 차이',true]);
    }}
  else if(k==='sell'&&ps.st==='holding'){var v=numOf('p-sell');if(v>0){var r=(v-ps.a.cur.buy)/ps.a.cur.buy*100;out.push(['구매 가격 '+won(ps.a.cur.buy)+' 대비 '+pct(r),false]);out.push([v>=ps.a.cur.target?'목표 가격 도달':'목표 가격 '+won(ps.a.cur.target)+' 전',false])}}
  else if(k==='revise'&&ps.st==='holding'){var f=valOf('p-field')||'buy',nv=numOf('p-val');if(nv>0)out.push([FIELD_LABEL[f]+' '+won(ps.a.cur[f])+' → '+won(nv),false])}
  return out.map(function(o){return '<span'+(o[1]?' class="warn"':'')+'>'+o[0]+'</span>'}).join('');
}

function waveArt(){
  var W=360,H=120,ps=[],i,x;
  for(i=0;i<28;i++){var d='';
    for(x=0;x<=W;x+=6){var t=x/W,y=14+i*3.3+Math.sin(t*5.6+i*.32)*(8+i*.75)*Math.sin(t*2.9+.7)+Math.cos(t*13+i*.25)*2.2;d+=(x?'L':'M')+x+','+y.toFixed(1)}
    ps.push('<path class="ln" d="'+d+'" opacity="'+(.12+.62*i/27).toFixed(2)+'"/>');}
  var cx=296;
  return '<svg class="art" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>'+
    '<linearGradient id="cr-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF6FF" stop-opacity=".95"/><stop offset="1" stop-color="#7C93A6" stop-opacity=".55"/></linearGradient>'+
    '<linearGradient id="cr-b" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93A7B8" stop-opacity=".7"/><stop offset="1" stop-color="#1D2A35" stop-opacity=".9"/></linearGradient></defs>'+
    ps.join('')+
    '<polygon points="'+cx+',6 '+(cx-30)+',100 '+(cx+2)+',114" fill="url(#cr-a)"/><polygon points="'+cx+',6 '+(cx+2)+',114 '+(cx+30)+',96" fill="url(#cr-b)"/>'+
    '<polyline points="'+(cx-30)+',100 '+cx+',6 '+(cx+30)+',96" fill="none" stroke="#F4FAFF" stroke-opacity=".55" stroke-width=".8"/><line x1="'+cx+'" y1="6" x2="'+(cx+2)+'" y2="114" stroke="#F4FAFF" stroke-opacity=".35" stroke-width=".6"/></svg>';
}
var HIST_CACHE={};
function seedRand(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return function(){h^=h<<13;h^=h>>>17;h^=h<<5;return ((h>>>0)%10000)/10000}}
// 예시 종목용 한 달 흐름 (시세 연결 전): 종목마다 늘 같은 모양, 마지막 날 등락은 화면 표시값과 같고 한 달 추세도 같은 방향
function stockHist(id){
  if(HIST_CACHE[id])return HIST_CACHE[id];
  var st=STOCKS[id],dir=st.chg>0?1:st.chg<0?-1:0,best=null;
  for(var k=0;k<12;k++){
    var rnd=seedRand(id+k),p=[st.price,st.price/(1+st.chg/100)];
    for(var i=0;i<18;i++){var r=dir*.004+(rnd()-.5)*.03;p.push(p[p.length-1]/(1+r))}
    p.reverse();best=p;
    if(dir===0||(p[p.length-1]-p[0])*dir>0)break;
  }
  return HIST_CACHE[id]=best.map(Math.round);
}
function stockSpark(id){return sparkSVG(stockHist(id),tone(STOCKS[id].chg))}
function sparkSVG(h,t){
  var v=(h||[]).filter(function(x){return x!=null});if(v.length<2)return '';
  var mx=Math.max.apply(null,v),mn=Math.min.apply(null,v),W=72,H=28;
  var pts=v.map(function(x,i){return (i/(v.length-1)*W).toFixed(1)+','+(mx===mn?H/2:2+(mx-x)/(mx-mn)*(H-4)).toFixed(1)}).join(' ');
  return '<svg class="spark '+t+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
}

function expertRanking(){
  return EXPERTS.map(function(x){return {x:x,st:expertStats(x.id)}}).sort(function(a,b){
    var ah=a.st.hitRate==null?-1:a.st.hitRate,bh=b.st.hitRate==null?-1:b.st.hitRate;
    return bh-ah||b.st.doneCount-a.st.doneCount||(b.st.sum||0)-(a.st.sum||0)||a.x.name.localeCompare(b.x.name,'ko');
  }).map(function(o,i){o.rank=i+1;return o});
}
function filteredExperts(){
  var q=S.xq.trim().toLowerCase();
  return expertRanking().filter(function(o){var x=o.x;
    if(S.xf==='live'&&!x.live)return false;
    if(S.xf==='fav'&&!isFollow(x.id))return false;
    if(['swing','day','long'].indexOf(S.xf)>-1&&x.style!==S.xf)return false;
    if(q&&(x.name+' '+x.tags.join(' ')+' '+x.channels.join(' ')+' '+x.intro).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}

(function(){

  function hostBtn(t){for(var el=t;el&&el.nodeType===1&&el!==document.body;el=el.parentElement){var bs=el.querySelectorAll('.share-btn');if(bs.length===1)return bs[0];if(bs.length>1)return null}return null}

  document.addEventListener('pointerover',function(e){if(e.pointerType==='mouse'&&app.contains(e.target))reveal(hostBtn(e.target))});

  },{passive:true});

  document.addEventListener('touchend',function(e){clearTimeout(timer);if(fired){fired=false;e.preventDefault()}},{passive:false});

  if(h.slice(0,2)==='r-'&&parseShare(h)){S.stack=[{t:'share',id:h}];return true}

  if(h.slice(0,2)==='s-'&&STOCKS[h.slice(2)]){S.stack=[{t:'stock',id:h.slice(2)}];return true}
  if(/^w-\d{8}$/.test(h)){var w=h.slice(2,6)+'-'+h.slice(6,8)+'-'+h.slice(8,10);S.rankWs=mondayOf(w)>THIS_WEEK?THIS_WEEK:mondayOf(w);S.stack=[{t:'rank'}];return true}
  if(h.slice(0,2)==='q-'&&PX.byCode[h.slice(2)]){S.stack=[{t:'q',id:h.slice(2)}];return true}
  if(h.slice(0,2)==='x-'&&expertById(h.slice(2))){S.stack=[{t:'expert',id:h.slice(2)}];S.dtab='record';S.open={};return true}
  S.landing=false;return false;
}
