<html lang="ko">
<head>

<style>
/* 리딩노트 · 카톡방 바로가기 도착 화면 (회차 · 종목 · 전문가 · 프로그램 · 내 종목)
   - 주소: ../l/코드/ (미리보기 카드) → land.html?c=코드 · ?from=방 은 방문 기록에만 써요
   - 기존 화면·주소와 따로 동작해요 */
:root{--bg:#F2F4F6;--surface:#FFFFFF;--raise:#F7F8FA;--sunk:#EEF0F3;--ink:#191F28;--ink2:#6B7684;--line:#EEF0F3;--accent:#5B4CF0;--accent-soft:#EEEBFF;--up:#F04452;--up-soft:#FFEEF0;--down:#3182F6;--down-soft:#E8F3FF;--warn:#C98A12;--warn-soft:#FFF6E0;
--f:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.scr{flex:1;padding-bottom:84px}
.top{position:sticky;top:0;z-index:5;background:rgba(242,244,246,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px 6px 6px;min-height:58px}
.top .logo{font-size:18px;font-weight:800;letter-spacing:-.3px;min-height:44px;display:flex;align-items:center;padding:0 10px;white-space:nowrap}
.top .logo i{font-style:normal;color:var(--accent)}
.top .back{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;min-height:44px;padding:0 10px;border-radius:12px;min-width:0;flex:1}
.top .back:active{background:var(--sunk)}
.top .back .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-ghost{min-height:44px;padding:0 14px;border-radius:12px;background:var(--surface);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.wrap{padding:4px 16px 24px}
.card{display:block;background:var(--surface);border-radius:18px;padding:18px;margin-bottom:12px}
a.card:active,.tap:active{background:var(--raise)}
.eyebrow{font-size:14px;color:var(--ink2);font-weight:600}
.h1{font-size:clamp(20px,6.2vw,24px);font-weight:800;letter-spacing:-.4px;margin:6px 0 4px;line-height:1.3}
.sub{font-size:15px;color:var(--ink2)}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ava{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}

.exp-h{display:flex;align-items:center;gap:12px;min-height:56px;margin:-6px -8px 6px;padding:6px 8px;border-radius:14px}
.exp-h:active{background:var(--raise)}
.exp-h .nm{min-width:0;flex:1}
.exp-h .nm b{display:block;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-h .nm small{display:block;font-size:13.5px;color:var(--ink2);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap;flex:none;display:flex;align-items:center;gap:2px}
.chev{color:#B0B8C1;font-size:22px;line-height:1;flex:none}
.pk{position:relative;border-top:1px solid var(--line)}
.pk-l{display:block;min-width:0;padding:12px 0;border-radius:12px}
.pk-l:active{background:var(--raise)}
.pk-n{display:flex;align-items:center;gap:7px;min-height:32px;padding-right:58px}
.pk-n b{font-size:17.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pk-q{font-size:15px;color:var(--ink);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pk-r{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.tag{font-size:12.5px;font-weight:700;padding:3px 7px;border-radius:6px;flex:none;white-space:nowrap;max-width:7.5em;overflow:hidden;text-overflow:ellipsis}
.tag.hid{background:var(--accent-soft);color:var(--accent)}
.tag.pub{background:var(--sunk);color:var(--ink2)}
.tag.con{background:var(--warn-soft);color:var(--warn)}
.add{position:absolute;top:0;right:0;z-index:1;min-height:56px;min-width:60px;padding:14px 0 0 0;display:flex;align-items:flex-start;justify-content:flex-end}
.add span{display:inline-block;height:28px;line-height:28px;padding:0 10px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.add.done span{background:var(--accent-soft);color:var(--accent)}
.prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.prices div{background:var(--raise);border-radius:10px;padding:8px;min-width:0}
.prices small{display:block;font-size:13px;color:var(--ink2);font-weight:600}
.prices b{display:block;font-size:clamp(12px,3.95vw,15.5px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.3px}
.prices .t b{color:var(--up)} .prices .x b{color:var(--down)} .prices .na b{color:#B0B8C1;font-weight:700}
.badge{display:inline-flex;align-items:center;font-size:13px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.b-wait{background:var(--sunk);color:var(--ink2)}
.b-hold{background:var(--accent-soft);color:var(--accent)}
.b-hit{background:var(--up-soft);color:var(--up)}
.b-cut{background:var(--down-soft);color:var(--down)}
.ret{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.3px}
.ret.up{color:var(--up)}.ret.dn{color:var(--down)}.ret.flat{color:var(--ink2)}
.rb{text-align:right;flex:none;max-width:56%;min-width:0}
.rb small{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rs{display:flex;align-items:baseline;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;background:var(--raise);border-radius:12px;padding:12px 14px;margin-top:10px}
.rs .ret{font-size:22px}
.rs small{font-size:13px;color:var(--ink2);font-weight:600}
.basis{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.ad{border:1px dashed #CDD3DA;border-radius:14px;padding:14px 16px;margin:0 0 12px;font-size:14px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;background:var(--surface)}
.ad b{font-size:11px;border:1px solid #CDD3DA;border-radius:4px;padding:1px 5px;color:#9AA1AA}
.sec-t{font-size:19px;font-weight:800;margin:20px 2px 10px}
.row{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px;margin:0 -8px;border-radius:12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--raise)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m small{display:block;font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .d{width:52px;text-align:center;flex:none}
.row .d b{display:block;font-size:20px;font-weight:800}
.row .d small{font-size:12.5px;color:var(--ink2);font-weight:700;white-space:nowrap}
.link-all{display:flex;align-items:center;justify-content:center;gap:4px;min-height:52px;margin-top:8px;border-radius:12px;background:var(--raise);font-size:15.5px;font-weight:700}
.link-all:active{background:var(--sunk)}
.notice{font-size:13.5px;color:var(--ink2);line-height:1.6;padding:14px 4px 4px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabbar a{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{color:var(--accent)}
.quote{background:var(--accent-soft);border-radius:16px;padding:16px;margin:12px 0}
.quote small{font-size:13px;font-weight:700;color:var(--accent)}
.quote p{font-size:17px;font-weight:600;line-height:1.55;margin-top:6px}
.big-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:16px;background:var(--accent);color:#fff;font-size:18px;font-weight:800;margin:4px 0 2px}
.big-btn.done{background:var(--accent-soft);color:var(--accent)}
.day{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);font-weight:700;margin:18px 0 10px;white-space:nowrap}
.day:before,.day:after{content:"";flex:1;height:1px;background:#DDE1E6}
.msg{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.msg .bub{display:block;background:var(--surface);border-radius:4px 16px 16px 16px;padding:12px 14px;font-size:16px;line-height:1.55;max-width:calc(100% - 44px);min-width:0}
.msg a.bub:active{background:var(--raise)}
.msg .bub small{display:block;font-size:12.5px;color:var(--ink2);margin-top:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:14px;padding:4px;margin:4px 0 12px}
.tabs button{min-height:46px;border-radius:11px;font-size:15.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ch .nm{min-width:0;flex:1}
.ch .nm b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:32px 12px}
.empty b{display:block;font-size:19px;margin-bottom:8px}
.empty p{font-size:15.5px;color:var(--ink2);line-height:1.6}
.grp-t{font-size:15px;font-weight:800;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.hint{font-size:13px;color:var(--ink2);text-align:center;margin-top:8px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#191F28;color:#fff;font-size:15px;font-weight:600;padding:12px 18px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;z-index:9}
.toast.on{opacity:1}
.op{background:#1E2430;color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.op h3{font-size:15px;margin-bottom:4px}
.op p{font-size:13px;color:#AEB6C2;margin-bottom:10px;line-height:1.5}
.op button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 12px;border-radius:10px;background:#2B3341;margin-bottom:6px;font-size:14.5px;font-weight:700;color:#fff;text-align:left}
.op button span{font-size:12px;color:#AEB6C2;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.load{padding:60px 20px;text-align:center;color:var(--ink2);font-size:15px}
.home-l{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;background:var(--surface);font-size:15.5px;font-weight:700;margin-top:4px}
@media (max-width:359px){
  .wrap{padding:4px 12px 24px}.card{padding:14px}
  .prices{gap:4px}.prices div{padding:7px 6px}.prices small{font-size:12px}
  .pk-n b{font-size:16.5px}.ret{font-size:16.5px}.rs .ret{font-size:20px}
  .top .logo{font-size:17px}.btn-ghost{padding:0 10px;font-size:14px}.tabbar a{font-size:12.5px}
}
@media (max-width:330px){.rb{max-width:48%}.ret{font-size:15.5px}}
</style>

<body>
<div class="app"><main class="scr" id="scr"><div class="load">불러오고 있어요…</div></main></div>
<div class="tabbar"><nav id="tabbar"></nav></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var CFG = window.SB_CFG || (window.__SB && window.__SB.projectId ? { url: "https://" + window.__SB.projectId + ".supabase.co", key: window.__SB.anonKey } : null) || { url: "https://khbgiybvzagvbilbqnsn.supabase.co", key: "sb_publishable_IHaBbRAESCgOJLi8jLPkVQ_X1AsUONe" };
var NOTICE = "방송 내용을 받아 적은 비공식 기록이에요. 방송사와 관계가 없으며, 투자 판단과 책임은 본인에게 있어요.";
var D = { feed: null, links: null, px: null }, BY = {}, X = {}, TAB = "on";
var Q = new URLSearchParams(location.search), FROM = (Q.get("from") || "").slice(0, 40), OP = Q.get("op") === "1";

/* ---------- 서버 ---------- */
function api(path, body){
  var o = { headers: { apikey: CFG.key, Authorization: "Bearer " + CFG.key, "Content-Type": "application/json" } };
  if (body !== undefined) { o.method = "POST"; o.body = JSON.stringify(body); }
  return fetch(CFG.url + "/rest/v1/" + path, o).then(function(r){ if (!r.ok) throw new Error(r.status); return r.status === 201 || r.status === 204 ? null : r.json(); });
}
function hit(code){ try { fetch(CFG.url + "/rest/v1/ln_hits", { method: "POST", headers: { apikey: CFG.key, Authorization: "Bearer " + CFG.key, "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify({ code: code, src: FROM || null }), keepalive: true }); } catch (e) {} }

/* ---------- 도우미 ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function won(n){ return n == null ? "-" : Math.round(n).toLocaleString("ko-KR") + "원"; }
function dd(s){ var p = String(s).split("-"); return (+p[1]) + "월 " + (+p[2]) + "일"; }
function md(s){ var p = String(s).split("-"); return (+p[1]) + "/" + (+p[2]); }
function dow(s){ return "일월화수목금토"[new Date(s + "T12:00:00+09:00").getUTCDay()]; }
function num(v){ var n = Number(v); return v === null || v === "" || !isFinite(n) || n <= 0 ? null : n; }
function toast(t){ var el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function(){ el.classList.remove("on"); }, 1700); }
function shareUrl(code){ return new URL("../l/" + code + "/", location.href).href; }
function landUrl(code){ return "land.html?c=" + encodeURIComponent(code); }
function copy(t, msg){ var done = function(){ toast(msg || "주소를 복사했어요"); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, function(){ fallback(); }); else fallback();
  function fallback(){ var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { prompt("주소를 길게 눌러 복사해 주세요", t); } ta.remove(); } }

/* ---------- 내 종목 (이 기기에만 저장) ---------- */
var MEM = [];
function myList(){ try { var v = JSON.parse(localStorage.getItem("ln.land.my") || "[]"); return Array.isArray(v) ? v : MEM; } catch (e) { return MEM; } }
function mySave(a){ MEM = a; try { localStorage.setItem("ln.land.my", JSON.stringify(a)); } catch (e) {} }
function has(code){ return myList().indexOf(code) > -1; }
window.lnToggle = function(code){ var a = myList(), i = a.indexOf(code); if (i > -1) { a.splice(i, 1); toast("내 종목에서 뺐어요"); } else { a.unshift(code); toast("내 종목에 담았어요"); } mySave(a); render(); };
window.lnShare = function(code){ copy(code ? shareUrl(code) : location.href.split("?")[0]); };
window.lnCopy = function(t){ copy(t, "복사했어요"); };
window.lnTab = function(t){ TAB = t; render(); };

/* ---------- 데이터 정리 ---------- */
function build(){
  var f = D.feed || {}, P = {};
  (f.programs || []).forEach(function(p){ P[p.id] = p; });
  BY = { prog: {}, ep: {}, x: {}, pick: {}, code: {} };
  (D.links || []).forEach(function(l){ BY[l.kind][l.k] = l.code; BY.code[l.code] = l; });
  X = {};
  var eps = (f.episodes || []).filter(function(e){ return e.published && !e.canceled && P[e.program_id]; }).sort(function(a, b){ return a.air_date < b.air_date ? 1 : -1; });
  eps.forEach(function(e){
    e.p = P[e.program_id];
    e.code = BY.ep[e.program_id + "|" + e.air_date];
    var order = [], byx = {};
    (e.experts || []).forEach(function(x){ if (x && x.id && !byx[x.id]) { byx[x.id] = { id: x.id, name: x.name, picks: [] }; order.push(x.id); } });
    (e.picks || []).forEach(function(k, i){
      if (k.kind === "secret" && !k.revealed) return;
      var xid = k.expert_id || ""; if (!xid) return;
      if (!byx[xid]) { byx[xid] = { id: xid, name: k.expert_name, picks: [] }; order.push(xid); }
      if (!k.stock_code && !k.stock_name) return;
      var o = { k: k, e: e, i: i, xid: xid, xname: k.expert_name || byx[xid].name, code: k.stock_code ? BY.pick[e.program_id + "|" + e.air_date + "|" + xid + "|" + k.stock_code] : null };
      o.st = calc(o); byx[xid].picks.push(o);
      if (!X[xid]) X[xid] = { id: xid, name: o.xname, picks: [], progs: {} };
    });
    e.xs = order.map(function(id){ return byx[id]; });
    e.xs.forEach(function(x){ if (!X[x.id]) X[x.id] = { id: x.id, name: x.name, picks: [], progs: {} }; X[x.id].progs[e.p.name] = 1; x.picks.forEach(function(o){ X[x.id].picks.push(o); }); });
  });
  D.eps = eps; D.P = P;
}
// 가격 흐름: 방송일 다음 거래일부터의 종가 (옛날 → 최근)
function series(code, date){
  var s = D.px && D.px.s && D.px.s[code], days = (D.px && D.px.days) || []; if (!s || !s.closes) return null;
  var cl = s.closes, out = [], base = null;
  if (s.asof && days.length && days[0] === s.asof) {
    for (var i = 0; i < days.length && i < cl.length; i++) { if (days[i] > date) out.unshift({ d: days[i], c: +cl[i] }); else if (base == null) base = +cl[i]; }
  }
  return { cur: num(s.c), asof: s.asof, after: out, dayClose: base };
}
// 상태: 진입 대기 / 보유 중 / 목표가 도달 / 손절가 이탈 (종가 기준, 먼저 닿은 쪽)
function calc(o){
  var k = o.k, buy = num(k.buy), tg = num(k.target), sp = num(k.stop);
  if (!D.feed || !D.feed.price_on || !k.stock_code) return null;
  var S = series(k.stock_code, o.e.air_date); if (!S || !S.cur) return null;
  var r = { cur: S.cur, asof: S.asof, buy: buy, tg: tg, sp: sp };
  r.base = buy || S.dayClose || null; r.fromBuy = !!buy;
  if (!r.base) return r;
  if (!S.after.length) { r.state = "pend"; return r; }
  var entered = !buy;
  for (var i = 0; i < S.after.length; i++) {
    var c = S.after[i].c;
    if (!entered) { if (c <= buy) entered = true; else continue; }
    if (tg && c >= tg) { r.state = "hit"; r.end = S.after[i].d; r.ret = (tg / r.base - 1) * 100; return r; }
    if (sp && c <= sp) { r.state = "cut"; r.end = S.after[i].d; r.ret = (sp / r.base - 1) * 100; return r; }

var ICON = { b: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg>', m: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>', x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>' };
function render(){
  var c = Q.get("c") || "", v = Q.get("v") || "", tab = "b", html;
  CUR = null;
  if (v === "my") { html = vMy(); tab = "m"; }
  else if (v === "x") { html = vExperts(); tab = "x"; }
  else if (c) {
    var l = BY.code[c]; CUR = l ? c : null;
    if (!l) html = vNone();
    else if (l.kind === "ep") { var e = D.eps.filter(function(x){ return x.program_id + "|" + x.air_date === l.k; })[0]; html = e ? vEp(e) : vNone(); }
    else if (l.kind === "pick") { var o = findPick(c); html = o ? vPick(o) : vNone(); }
    else if (l.kind === "x") { html = vExpert(l.k); tab = "x"; }
    else if (l.kind === "prog") html = vProg(l.k);
    else html = vNone();
  } else html = vHub();
  document.getElementById("scr").innerHTML = html;
  var my = myList().length;
  document.getElementById("tabbar").innerHTML = '<a href="land.html" class="' + (tab === "b" ? "on" : "") + '">' + ICON.b + '방송</a><a href="land.html?v=my" class="' + (tab === "m" ? "on" : "") + '">' + ICON.m + "내 종목" + (my ? " " + my : "") + '</a><a href="land.html?v=x" class="' + (tab === "x" ? "on" : "") + '">' + ICON.x + "전문가</a>";
  var t = document.querySelector(".h1"); document.title = (t ? t.textContent + " · " : "") + "리딩노트";
}
function start(){
  var c = Q.get("c"); if (c) hit(c);
  Promise.all([api("rpc/bc_feed", {}), api("ln_links?select=code,kind,k&limit=5000")]).then(function(r){
    D.feed = r[0] || {}; D.links = r[1] || [];
    var codes = {}; (D.feed.episodes || []).forEach(function(e){ (e.picks || []).forEach(function(k){ if (k.stock_code) codes[k.stock_code] = 1; }); });
    var list = Object.keys(codes), jobs = [];
    for (var i = 0; i < list.length; i += 80) jobs.push(api("rpc/ln_px", { p_codes: list.slice(i, i + 80) }).catch(function(){ return null; }));
    return Promise.all(jobs).then(function(rs){ D.px = { days: [], s: {} }; rs.forEach(function(x){ if (!x) return; if (x.days && x.days.length) D.px.days = x.days; Object.assign(D.px.s, x.s || {}); }); });
  }).then(function(){ build(); render(); }).catch(function(){ document.getElementById("scr").innerHTML = '<div class="wrap"><div class="card empty" style="margin-top:20px"><b>잠시 연결이 어려워요</b><p>잠시 뒤에 다시 열어 주세요.</p><a class="big-btn" style="margin-top:16px" href="">다시 열기</a></div></div>'; });
}
start();
})();
</script>
