<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<meta name="robots" content="noindex">
<meta name="description" content="리딩 모음 · 투자 도구 · 커뮤니티 — 50~80대를 위한 쉬운 투자 정보 (체험판)">
<meta property="og:title" content="리딩노트">
<meta property="og:description" content="리딩 모음 · 투자 도구 · 커뮤니티 (체험판)">
<title>리딩노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
/* 리딩노트 통합 셸: 맨 위 3탭(리딩 모음 · 투자 도구 · 커뮤니티) + [가] 설정 + 공지 띠. 각 서비스는 아래 화면에 그대로, 관리자는 별도 전체 화면 */
:root{
  --bg:#0B0F14; --surface:#11171E; --raise:#161D25; --line:#222B35; --ink:#EEF2F5; --ink2:#8D99A6;
  --accent:#C6F25E; --on-accent:#0B0F14; --acc-soft:rgba(198,242,94,.12);
  --up:#F2636D; --down:#6E9BFF; --warn:#F5B94A; --warn-soft:rgba(245,185,74,.14);
  --sa:#78A02A; --sb:#5B85EB; --sn:#6B7785;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono','IBM Plex Sans KR',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F5F7; --surface:#FFFFFF; --raise:#EEF1F4; --line:#D9DFE5; --ink:#0D1117; --ink2:#56616D;
  --accent:#3F6F00; --on-accent:#FFFFFF; --acc-soft:rgba(63,111,0,.09);
  --up:#D32F2F; --down:#1F4DB5; --warn:#9A6200; --warn-soft:rgba(154,98,0,.09); --sa:#4C7A00; --sb:#2F5FCC; --sn:#7A8590; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F5F7; --surface:#FFFFFF; --raise:#EEF1F4; --line:#D9DFE5; --ink:#0D1117; --ink2:#56616D;
  --accent:#3F6F00; --on-accent:#FFFFFF; --acc-soft:rgba(63,111,0,.09);
  --up:#D32F2F; --down:#1F4DB5; --warn:#9A6200; --warn-soft:rgba(154,98,0,.09); --sa:#4C7A00; --sb:#2F5FCC; --sn:#7A8590; color-scheme:light}
html{font-size:16px}
html[data-size="l"]{font-size:18px}
html[data-size="xl"]{font-size:20px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:1rem;line-height:1.55;-webkit-text-size-adjust:100%;overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;word-spacing:-.3em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 셸 ---------- */
.shell{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-top{flex:none;background:var(--bg);border-bottom:1px solid var(--line);position:relative;z-index:2}
.sh-in{max-width:520px;margin:0 auto;display:flex;align-items:stretch;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.tabs{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tab{position:relative;min-height:3.25rem;border:0;background:transparent;color:var(--ink2);font-weight:600;font-size:1.0625rem;white-space:nowrap;padding:0 .25rem;letter-spacing:-.01em}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.tab .dot{position:absolute;top:.7rem;margin-left:.15rem;width:.4rem;height:.4rem;border-radius:50%;background:var(--up)}
.setbtn{flex:none;align-self:center;width:2.75rem;height:2.5rem;margin-left:.25rem;border:1px solid var(--line);border-radius:.6rem;background:var(--surface);display:flex;align-items:baseline;justify-content:center;gap:1px;padding-top:.35rem;line-height:1}
.setbtn .s{font-size:.75rem;font-weight:600;color:var(--ink2)}
.setbtn .b{font-size:1.25rem;font-weight:700}
.notice{flex:none;background:var(--acc-soft);border-bottom:1px solid var(--line)}
.notice-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:.6rem;padding:.55rem .25rem .55rem 16px}
.notice .nl{flex:none;font-size:.8125rem;font-weight:700;padding:.1rem .45rem;border-radius:.3rem;background:var(--accent);color:var(--on-accent)}
.notice .nt{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:.2rem 0;font-size:.9375rem;line-height:1.45}
.notice .nt b{font-weight:600}
.notice .nx{flex:none;width:2.5rem;height:2.5rem;border:0;background:transparent;color:var(--ink2);font-size:1.25rem;border-radius:.5rem}
.frames{flex:1;min-height:0;position:relative}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.frames iframe.off{visibility:hidden;pointer-events:none}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:1rem}

/* ---------- 설정 시트 ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:1.1rem 1.1rem 0 0;padding:1.1rem 16px calc(1.25rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:1.1rem;max-height:90%;overflow:auto}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{font-size:1.25rem}
.x{width:2.75rem;height:2.75rem;border:0;background:transparent;font-size:1.5rem;color:var(--ink2);border-radius:.5rem}
.sl{font-size:.9375rem;color:var(--ink2);font-weight:600;margin-bottom:.45rem}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.size{min-height:5.25rem;border:1px solid var(--line);border-radius:.75rem;background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem}
.size .ga{font-weight:700;line-height:1.1}
.size span:last-child{font-size:.875rem;color:var(--ink2)}
.size[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.seg button{min-height:3.25rem;border:1px solid var(--line);border-radius:.75rem;background:var(--raise);font-weight:600}
.hint{font-size:.875rem;color:var(--ink2)}
.btn{min-height:3.25rem;border-radius:.75rem;border:1px solid var(--line);background:var(--raise);font-weight:700;padding:0 1rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-block{width:100%}
.btn-sm{min-height:2.5rem;font-size:.9375rem;padding:0 .8rem;border-radius:.6rem}

/* ---------- 통합 관리자 ---------- */
.admin{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))}
.ad-top{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.ad-top-in{max-width:1080px;margin:0 auto;padding:.6rem 16px;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.ad-top h1{font-size:1.1875rem;display:flex;align-items:baseline;gap:.5rem;margin-right:auto;white-space:nowrap}
.ad-top h1 small{font-family:var(--f-mono);font-size:.75rem;color:var(--ink2);letter-spacing:.08em;font-weight:500}
.ad-wrap{max-width:1080px;margin:0 auto;padding:1rem 16px;display:grid;gap:1rem}
@media (min-width:900px){.ad-wrap{grid-template-columns:200px minmax(0,1fr);align-items:start}.ad-nav{position:sticky;top:4.5rem;flex-direction:column;overflow:visible;margin:0;padding:0}.ad-nav button{justify-content:flex-start}}
.ad-nav{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px .15rem}
.ad-nav::-webkit-scrollbar{display:none}
.ad-nav button{flex:none;white-space:nowrap}
.ad-nav button{min-height:2.75rem;padding:0 .9rem;border:1px solid var(--line);border-radius:.6rem;background:var(--surface);font-weight:600;font-size:.9375rem;display:flex;align-items:center;gap:.4rem}
.ad-nav button[aria-current="page"]{border-color:var(--accent);background:var(--acc-soft);color:var(--ink)}
.ad-nav .cnt{font-family:var(--f-mono);font-size:.75rem;padding:0 .35rem;border-radius:.3rem;background:var(--up);color:#fff}
.ad-main{display:flex;flex-direction:column;gap:1rem;min-width:0}
.ad-h{display:flex;flex-direction:column;gap:.25rem}
.ad-h h2{font-size:1.375rem}
.ad-h p{color:var(--ink2);font-size:.9375rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.875rem;padding:1rem;display:flex;flex-direction:column;gap:.75rem;min-width:0}
.card h3{font-size:1.0625rem;display:flex;align-items:center;gap:.5rem}
.card h3 .meta{margin-left:auto;font-size:.8125rem;color:var(--ink2);font-weight:500;font-family:var(--f-mono)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.6rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:.75rem;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.15rem;min-width:0}
.kpi .k{font-size:.8125rem;color:var(--ink2)}
.kpi b{font-family:var(--f-mono);font-size:1.5rem;font-weight:600;word-spacing:-.3em;line-height:1.25}
.kpi .s{font-size:.8125rem;color:var(--ink2)}
.kpi.alert{border-color:var(--up)}
.kpi.alert b{color:var(--up)}
.todo{display:flex;flex-direction:column}
.todo button{display:flex;align-items:center;gap:.7rem;text-align:left;padding:.8rem 0;border:0;border-top:1px solid var(--line);background:transparent;min-height:3.25rem}
.todo button:first-child{border-top:0}
.todo .ti{flex:none;width:.6rem;height:.6rem;border-radius:50%;background:var(--ink2)}
.todo .ti.red{background:var(--up)} .todo .ti.acc{background:var(--accent)}
.todo .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.todo .tt span{font-size:.875rem;color:var(--ink2)}
.todo .go{color:var(--ink2);font-size:1.125rem}
.tw{overflow-x:auto;margin:0 -1rem;padding:0 1rem}
table{border-collapse:collapse;width:100%;font-size:.9375rem}
th,td{padding:.55rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.8125rem;color:var(--ink2);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);word-spacing:-.3em;white-space:nowrap}
td.c,th.c{text-align:center}
.tag{display:inline-flex;align-items:center;padding:.05rem .45rem;border-radius:.3rem;font-size:.8125rem;font-weight:600;background:var(--raise);color:var(--ink2);white-space:nowrap}
.tag.red{background:rgba(242,99,109,.15);color:var(--up)}
.tag.acc{background:var(--acc-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.row{display:flex;align-items:center;gap:.75rem;padding:.75rem 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:.15rem}
.row .rt .who{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;font-size:.875rem;color:var(--ink2)}
.row .rt .who b{color:var(--ink);font-size:.9375rem}
.row .rt p{font-size:.9375rem;overflow-wrap:anywhere}
.row.hid .rt p{color:var(--ink2);text-decoration:line-through}
.sw{flex:none;min-width:5.25rem;min-height:2.75rem;border-radius:.6rem;border:1px solid var(--line);background:var(--raise);font-weight:700;font-size:.9375rem}
.sw[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sw:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:.35rem}
.field label{font-size:.9375rem;font-weight:600}
.field textarea,.field input{width:100%;min-height:3.25rem;border:1px solid var(--line);border-radius:.6rem;background:var(--raise);padding:.7rem .8rem;font-size:1rem;line-height:1.5;resize:vertical}
.field .cnt{font-size:.8125rem;color:var(--ink2);text-align:right;font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips button{min-height:2.75rem;padding:0 .85rem;border:1px solid var(--line);border-radius:.6rem;background:var(--raise);font-weight:600;font-size:.9375rem}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.preview{border:1px dashed var(--line);border-radius:.75rem;overflow:hidden}
.preview .notice{border-bottom:0}
.preview .cap{font-size:.75rem;color:var(--ink2);padding:.35rem .6rem;font-family:var(--f-mono);letter-spacing:.06em;border-bottom:1px dashed var(--line)}
.split{display:flex;height:.6rem;border-radius:.3rem;overflow:hidden;background:var(--raise)}
.split i{display:block;height:100%}
.vs{display:flex;justify-content:space-between;font-size:.9375rem;gap:.5rem}
.vs b{font-family:var(--f-mono);word-spacing:-.3em}
.op{display:flex;gap:.75rem;padding:.8rem 0;border-top:1px solid var(--line);align-items:flex-start}
.op:first-child{border-top:0;padding-top:0}
.op .ot{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem}
.op .ot .who{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;font-size:.875rem;color:var(--ink2)}
.op .ot .who b{color:var(--ink);font-size:.9375rem}
.op .ot p{font-size:.9375rem}
.side{display:inline-flex;align-items:center;gap:.25rem;font-size:.8125rem;font-weight:600}
.side i{width:.55rem;height:.55rem;border-radius:50%;display:inline-block}
.bars{display:flex;flex-direction:column;gap:.5rem}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.15rem .6rem;font-size:.9375rem}
.bar .tr{grid-column:1/-1;height:.5rem;border-radius:0 .25rem .25rem 0;background:var(--sn,#6B7785)}
.bar.top .tr{background:var(--accent)}
.bar b{font-family:var(--f-mono);font-weight:500;word-spacing:-.3em}
.note{font-size:.875rem;color:var(--ink2);line-height:1.55}
.dot-y{color:var(--accent);font-weight:700}
.dot-n{color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:.75rem 1.1rem;border-radius:.75rem;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.lb{display:flex;align-items:center;gap:.75rem;padding:.75rem 0;border-top:1px solid var(--line)}
.lb:first-child{border-top:0;padding-top:0}
.lb .rk{flex:none;width:1.75rem;height:1.75rem;border-radius:50%;background:var(--raise);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600;font-size:.875rem}
.lb .rk.top{background:var(--accent);color:var(--on-accent)}
.lb .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.lb .lt b{font-size:1rem}
.lb .lt span{font-size:.8125rem;color:var(--ink2)}
.lb .lv{flex:none;display:flex;flex-direction:column;align-items:flex-end}
.lb .lv b{font-family:var(--f-mono);font-size:1.0625rem;word-spacing:-.3em}
.lb .lv span{font-size:.8125rem;color:var(--ink2);font-family:var(--f-mono);word-spacing:-.3em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="shell" id="shell">
  <header class="sh-top"><div class="sh-in">
    <div class="tabs" role="tablist" aria-label="서비스" id="tabs"></div>
    <button class="setbtn" id="setbtn" aria-label="글자 크기·화면 밝기 바꾸기"><span class="s">가</span><span class="b">가</span></button>
  </div></header>
  <div class="notice" id="notice" hidden></div>
  <div class="frames" id="frames"><div class="loading" id="loading">불러오는 중…</div></div>
</div>
<div class="admin" id="admin" hidden></div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="supabase.js?v=202610201408"></script>
<script src="config.js?v=202610201408"></script>
<script>window.APP_URL={ln:"ln.html?v=202610201408",tools:"tools.html?v=202610201408",cm:"community.html?v=202610201408"};</script>
<script>
(function(){
/* ===== 설정 (세 서비스 공통) ===== */
var KEY='site.v1';
var APPS=[['ln','리딩 모음'],['tools','투자 도구'],['cm','커뮤니티']];
var NAME={ln:'리딩 모음',tools:'투자 도구',cm:'커뮤니티'};
var DEF={size:'m',theme:'dark',tab:'ln',
  notice:{on:true,text:'세 서비스가 한곳에 모였어요. 맨 위 탭으로 골라 보세요.',where:'all',to:'',v:1},
  noticeClosed:0,hideP:{},picks:[],hiddenChat:{},lnHidden:{}};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
var C=(function(){var l=load()||{},o=JSON.parse(JSON.stringify(DEF));Object.keys(l).forEach(function(k){o[k]=l[k]});o.notice=Object.assign({},DEF.notice,l.notice||{});o.hideP=o.hideP||{};o.picks=o.picks||[];o.hiddenChat=o.hiddenChat||{};o.lnHidden=o.lnHidden||{};o.db=false;return o})();
function save(){window.__siteCfg=C;try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}}
save();
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(n){return Number(n||0).toLocaleString('ko-KR')}
function pct1(x){if(x==null||isNaN(x))return '—';var r=Math.round(x*10)/10;return (r>0?'+':r<0?'−':'')+Math.abs(r).toFixed(1)+'%'}
function dateK(s){if(!s)return '—';var p=s.split('-');return (+p[1])+'월 '+(+p[2])+'일'}
function $(id){return document.getElementById(id)}
var tt=null;function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2600)}
function setHash(x){try{history.replaceState(null,'','#'+x)}catch(e){}}

/* ===== 서비스 화면 (각 앱은 따로 돌고, 같은 저장소를 씀) ===== */
var F={},READY={},Q={};
function mk(id){
  if(F[id])return F[id];
  var f=document.createElement('iframe');f.title=NAME[id];f.className='off';f.setAttribute('tabindex','-1');f.setAttribute('inert','');
  f.addEventListener('load',function(){READY[id]=true;applyTo(id);if(Q[id]){var r=Q[id];Q[id]=null;goTo(id,r)}if(id===C.tab)$('loading').hidden=true;if(adminOpen)renderAdmin()});
  if(window.APP_URL)f.src=window.APP_URL[id];else f.srcdoc=window.APP_SRC[id];$('frames').appendChild(f);F[id]=f;return f;
}
function W(id){try{return READY[id]?F[id].contentWindow:null}catch(e){return null}}
function applyTo(id){var w=W(id);try{if(w&&w.__site)w.__site.apply(C)}catch(e){}}
function applyShell(){var r=document.documentElement;r.setAttribute('data-theme',C.theme);r.setAttribute('data-size',C.size)}
function applyAll(){applyShell();Object.keys(F).forEach(applyTo)}
function goTo(id,r){if(!READY[id]){Q[id]=r;return}var w=W(id);try{if(w&&w.__site)w.__site.go(r)}catch(e){}}
function show(id,route){

DB.init=function(){

  if(dbOn())h+='<section class="card"><h3>관리자 계정</h3><p>'+esc(DB.email||'')+' <span class="tag acc">관리자</span></p><button class="btn btn-block" data-ad="logout">로그아웃</button><p class="note">관리자를 더 두려면 Supabase에서 계정을 만든 뒤 SQL 맨 아래 “관리자 지정” 줄을 실행해요.</p></section>';
  h+='<section class="card"><h3>'+(dbOn()?'리딩 모음 체험 권한 (화면 보기용)':'지금 체험 중인 권한')+'</h3><div class="chips" role="group" aria-label="체험 권한">'+['guest','member','expert','admin'].map(function(v){return '<button data-ad="role:'+v+'" aria-pressed="'+(r===v)+'">'+RN[v]+'</button>'}).join('')+'</div><p class="note">체험용으로 권한을 바꿔 볼 수 있어요. 실서비스에서는 관리자 계정만 이 페이지에 들어와요.</p></section>';
  var WHO={'●●●●':['누구나',''],'—●●●':['회원부터','acc'],'——●●':['전문가 · 관리자','warn'],'———●':['관리자만','red']};
  h+='<section class="card"><h3>권한표 (실서비스 기준 안)</h3>'+['리딩 모음','투자 도구','커뮤니티','운영'].map(function(sv){return '<div><p class="sl" style="margin:.25rem 0 .1rem">'+sv+'</p>'+rows.filter(function(x){return x[0]===sv}).map(function(x){var w=WHO[x[2]];return '<div class="row" style="padding:.6rem 0"><span class="rt"><p>'+x[1]+'</p></span><span class="tag '+w[1]+'">'+w[0]+'</span></div>'}).join('')+'</div>'}).join('')+
  '<p class="note">전문가는 본인 리딩만 올릴 수 있어요. 회원 목록 · 정지 · 탈퇴 처리는 서버(회원 DB)를 붙이면 이 화면에 생겨요.</p></section>';
  return h;
}

/* ----- 관리자 동작 ----- */
$('admin').addEventListener('click',function(e){
  var b=e.target.closest('[data-ad]');if(!b||b.disabled)return;
  var p=b.getAttribute('data-ad').split(':'),a=p[0],v=p.slice(1).join(':');
  var ln=W('ln'),tl=W('tools'),cm=W('cm');
  if(a==='exit'){closeAdmin();return}
  if(a==='sec'){AD.sec=v;AD.nd=null;renderAdmin();$('admin').scrollTop=0;return}
  if(a==='ntog'){AD.nd.on=!AD.nd.on;renderAdmin();return}
  if(a==='nwhere'){AD.nd.where=v;renderAdmin();return}
  if(a==='nto'){AD.nd.to=v;renderAdmin();return}
  if(a==='nsave'){var d=AD.nd;d.text=($('nd-text').value||'').trim().slice(0,60);if(d.on&&!d.text){toast('공지 내용을 적어 주세요');return}
    C.notice={on:d.on,text:d.text,where:d.where,to:d.to,v:(C.notice.v||1)+1};persist('notice');renderNotice();AD.nd=null;renderAdmin();toast(d.on?'공지를 게시했어요':'공지를 내렸어요');return}
  if(a==='lnadmin'){closeAdmin(true);show('ln','admin');return}
  if(a==='open'){var q=v.split(':');closeAdmin(true);show(q[0],q[1]);return}
  if(a==='preset'){C.hideP[v]=!C.hideP[v];persist('hideP');try{tl.render()}catch(x){}renderAdmin();toast(C.hideP[v]?'홈에서 숨겼어요':'홈에 다시 보여요');return}
  if(a==='pick'){
    if(v==='me'){cm.P.picked=!cm.P.picked;cm.save();toast(cm.P.picked?'회원 의견을 뽑았어요 · 커뮤니티 홈에 축하 안내가 떠요':'뽑기를 취소했어요')}
    else{var i=C.picks.indexOf(v);if(i>-1)C.picks.splice(i,1);else C.picks.push(v);persist('picks');applyAll();toast(i>-1?'뽑기를 취소했어요':'의견을 뽑았어요')}
    try{cm.render()}catch(x){}renderAdmin();return}
  if(a==='rtab'){AD.rtab=v;renderAdmin();return}
  if(a==='lnhide'&&dbOn()){if(C.lnHidden[v]){delete C.lnHidden[v];toast('다시 보이게 했어요')}else{C.lnHidden[v]=1;toast('모든 회원에게 숨겼어요')}persist('lnHidden');applyAll();renderAdmin();return}
  if(a==='lnhide'){if(ln.P.hidden[v]){delete ln.P.hidden[v];delete ln.P.reported[v];toast('다시 보이게 했어요')}else{ln.P.hidden[v]=1;toast('숨겼어요')}ln.save();try{ln.render()}catch(x){}renderAdmin();return}
  if(a==='cmhide'){if(C.hiddenChat[v]){delete C.hiddenChat[v];toast('다시 보이게 했어요')}else{C.hiddenChat[v]=1;toast('숨겼어요')}persist('hiddenChat');try{cm.render()}catch(x){}renderAdmin();return}
  if(a==='logout'){DB.logout().then(function(){renderAdmin();toast('로그아웃했어요')});return}
  if(a==='role'){try{ln.A.asRole(v)}catch(x){}renderAdmin();toast('체험 권한: '+({guest:'게스트',member:'회원',expert:'전문가',admin:'관리자'})[v]);return}
});
$('admin').addEventListener('submit',function(e){
  if(e.target.id!=='ad-login')return;e.preventDefault();if(AD.busy)return;
  var em=($('ad-email').value||'').trim(),pw=$('ad-pw').value||'';AD.email=em;
  if(!em||!pw){AD.loginErr='이메일과 비밀번호를 넣어 주세요';renderAdmin();return}
  AD.busy=true;AD.loginErr='';renderAdmin();
  DB.login(em,pw).then(function(r){AD.busy=false;
    if(r.error)AD.loginErr=/invalid|credentials/i.test(r.error.message||'')?'이메일 또는 비밀번호가 맞지 않아요':'로그인하지 못했어요 ('+(r.error.message||'오류')+')';
    else if(!DB.admin)AD.loginErr='로그인은 됐지만 관리자 권한이 없는 계정이에요. SQL 맨 아래 “관리자 지정” 줄을 실행해 주세요.';
    else{AD.loginErr='';toast('관리자로 로그인했어요');ADB.rt=0}
    renderAdmin();
  });
});
$('admin').addEventListener('input',function(e){
  if(e.target.id!=='nd-text'||!AD.nd)return;
  AD.nd.text=e.target.value.slice(0,60);$('nd-cnt').textContent=AD.nd.text.length+' / 60';
  var pv=$('nd-pv');if(pv&&AD.nd.on)pv.innerHTML=noticeInner(AD.nd,true);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&adminOpen&&!$('layer').innerHTML)closeAdmin()});

/* ===== 시작 ===== */
applyShell();
var h0=(location.hash||'').replace('#','');
if(h0==='admin'){show(C.tab);openAdmin('dash')}
else show(NAME[h0]?h0:C.tab);
window.__shell={C:C,F:F,READY:READY,show:show,openAdmin:openAdmin,closeAdmin:closeAdmin,openSettings:openSettings,DB:DB};
DB.init();
})();

</script>
